<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1B5FC2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sotelo7 &middot; Your Life in Balance</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --azul:#1B5FC2; --azul-cl:#3B82E8; --azul-os:#134A9E; --azul-xs:#0E3573;
  --coral:#FF5A4A; --coral-os:#D93C2E;
  --sol:#FFC220; --sol-os:#D9A00F;
  --texto:#12293F; --gris:#4E6B87; --linea:#D5E3F3; --linea-sf:#EDF3FA;
  --papel:#FFFFFF; --fondo:#F4F8FD;
  --ok:#1F8A5A; --ok-os:#15613F; --venc:#C62828; --hoy:#FFC220; --urg:#FF5A4A;
  --header-txt:#FFFFFF;
  --r:16px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--fondo);color:var(--texto);line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased;}
.oculto{display:none !important;}
button{font-family:inherit;}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--linea);border-radius:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--texto);outline:none;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--azul);}
textarea{min-height:130px;resize:vertical;}
label{display:block;font-size:12px;font-weight:600;color:var(--azul-os);margin-bottom:6px;letter-spacing:.3px;text-transform:uppercase;}

/* ===== BOTONES ===== */
.btn{border:none;cursor:pointer;padding:13px 20px;border-radius:13px;font-size:15px;font-weight:600;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s,transform .08s;}
.btn:active{transform:translateY(1px);}
.btn:hover{filter:brightness(1.06);}
.btn-primario{background:var(--azul);}
.btn-coral{background:var(--coral);}
.btn-ok{background:var(--ok);}
.btn-suave{background:var(--linea-sf);color:var(--azul);}
.btn-borde{background:transparent;border:1.5px solid var(--linea);color:var(--gris);}
.icon-btn{border:none;cursor:pointer;width:36px;height:36px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;color:#fff;background:var(--azul);transition:filter .15s;}
.icon-btn:hover{filter:brightness(1.08);}
.ib-ok{background:var(--ok);} .ib-del{background:#EDF3FA;color:#4E6B87;} .ib-edit{background:var(--azul-cl);}

/* ===== LOGIN ===== */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#0E3573 0%,#1B5FC2 55%,#3B82E8 100%);}
.login-card{background:#fff;border-radius:26px;padding:34px 26px 30px;width:100%;max-width:370px;box-shadow:0 22px 50px rgba(10,40,90,.28);text-align:center;}
.login-mark{width:96px;height:96px;margin:0 auto 16px;}
.login-mark svg{width:100%;height:100%;display:block;}
.login-nombre{font-size:31px;font-weight:800;letter-spacing:-1px;color:var(--azul);margin-bottom:2px;}
.login-nombre span{color:var(--coral);}
.login-tag{font-size:10.5px;letter-spacing:2.6px;color:var(--gris);text-transform:uppercase;margin-bottom:24px;}
.msg{padding:11px 14px;border-radius:11px;font-size:13.5px;margin-bottom:14px;text-align:left;}
.msg-err{background:#FDECEC;color:#B62B2B;border:1px solid #F6C9C9;}

/* ===== HEADER ===== */
.hdr{position:sticky;top:0;z-index:40;background:var(--azul);color:var(--header-txt);padding:11px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 14px rgba(10,40,90,.18);}
.burger{width:40px;height:40px;border:none;border-radius:12px;background:rgba(255,255,255,.16);color:var(--header-txt);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex-shrink:0;}
.burger span{display:block;width:18px;height:2px;background:currentColor;border-radius:2px;transition:transform .25s,opacity .2s;}
.burger.abierto span:nth-child(1){transform:translateY(6px) rotate(45deg);}
.burger.abierto span:nth-child(2){opacity:0;}
.burger.abierto span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}
.hdr-mark{width:34px;height:34px;flex-shrink:0;}
.hdr-mark svg{width:100%;height:100%;display:block;border-radius:9px;}
.hdr-txt{flex:1;min-width:0;}
.hdr-txt h1{font-size:17px;font-weight:700;letter-spacing:-.3px;line-height:1.1;}
.hdr-txt p{font-size:9.5px;opacity:.72;letter-spacing:1.6px;text-transform:uppercase;}
.hdr-acc{display:flex;gap:6px;flex-shrink:0;}
.hdr-ib{width:36px;height:36px;border:none;border-radius:11px;background:rgba(255,255,255,.18);color:var(--header-txt);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;}

/* ===== DRAWER ===== */
#overlay{position:fixed;inset:0;background:rgba(9,28,56,.45);z-index:48;opacity:0;pointer-events:none;transition:opacity .25s;}
#overlay.show{opacity:1;pointer-events:auto;}
#drawer{position:fixed;top:0;left:0;bottom:0;width:270px;max-width:82vw;background:#fff;z-index:49;transform:translateX(-102%);transition:transform .27s cubic-bezier(.4,0,.2,1);box-shadow:4px 0 26px rgba(10,40,90,.2);display:flex;flex-direction:column;}
#drawer.open{transform:translateX(0);}
.dw-top{background:var(--azul);color:#fff;padding:20px 18px 18px;}
.dw-top .m{width:44px;height:44px;margin-bottom:10px;}
.dw-top .m svg{width:100%;height:100%;border-radius:12px;display:block;}
.dw-top h2{font-size:19px;font-weight:800;letter-spacing:-.4px;}
.dw-top p{font-size:9.5px;opacity:.75;letter-spacing:2px;text-transform:uppercase;}
.dw-nav{flex:1;overflow-y:auto;padding:10px;}
.dw-item{width:100%;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:13px;font-size:15px;font-weight:600;color:var(--texto);text-align:left;transition:background .15s;}
.dw-item:hover{background:var(--linea-sf);}
.dw-item .ic{width:26px;display:flex;align-items:center;justify-content:center;color:var(--azul);font-size:21px;flex-shrink:0;}
.dw-item .ct{margin-left:auto;font-size:12px;font-weight:700;color:var(--azul-os);background:var(--linea-sf);padding:2px 9px;border-radius:9px;}
.dw-pie{padding:12px 16px;border-top:1px solid var(--linea);font-size:11px;color:var(--gris);}

/* ===== CONTENIDO ===== */
.wrap{padding:16px 14px 40px;max-width:760px;margin:0 auto;}
.zona{margin-bottom:26px;scroll-margin-top:76px;}
.zona-tit{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-left:2px;}
.zona-tit .ic{display:flex;align-items:center;justify-content:center;color:var(--azul);font-size:19px;}
.zona-tit h3{font-size:13.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--azul-os);}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:10px;}
.acc{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);padding:15px 10px;text-align:center;cursor:pointer;transition:transform .12s,box-shadow .15s;}
.acc:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,60,120,.1);}
.acc .dot{height:42px;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;color:var(--azul);font-size:27px;}
.acc .nm{font-size:12.5px;font-weight:600;line-height:1.25;}
.fila{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px;transition:border-color .15s,transform .12s;}
.fila:hover{border-color:var(--azul-cl);transform:translateX(2px);}
.fila .ic{width:32px;display:flex;align-items:center;justify-content:center;color:var(--azul);font-size:22px;flex-shrink:0;}
.fila .inf{flex:1;min-width:0;}
.fila .nm{font-size:14.5px;font-weight:600;}
.fila .ct{font-size:12.5px;color:var(--gris);}
.fila .ch{color:#A9BFD6;font-size:18px;display:flex;align-items:center;}

/* ===== PANTALLA ===== */
#pantalla{position:fixed;inset:0;background:var(--fondo);z-index:60;transform:translateX(100%);transition:transform .27s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;}
#pantalla.activa{transform:translateX(0);}
.pt-top{background:var(--azul);color:#fff;padding:13px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 14px rgba(10,40,90,.16);flex-shrink:0;}
.pt-top .volver{width:38px;height:38px;border:none;border-radius:12px;background:rgba(255,255,255,.2);color:#fff;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;}
.pt-top h2{font-size:17px;font-weight:700;flex:1;}
.pt-body{flex:1;overflow-y:auto;padding:16px 14px 60px;}
.pt-body>*{max-width:760px;margin-left:auto;margin-right:auto;}

/* ===== TARJETAS ===== */
.card{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);padding:18px;margin-bottom:14px;}
.card h3{font-size:15.5px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:9px;color:var(--azul);}
.form-grid{display:flex;flex-direction:column;gap:14px;margin-bottom:16px;}

/* ===== TAREA ===== */
.tarea{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:13px 14px;margin-bottom:9px;display:flex;align-items:flex-start;gap:11px;}
.tarea .asa{color:#A9BFD6;font-size:19px;cursor:grab;flex-shrink:0;padding-top:2px;touch-action:none;}
.tarea .cuerpo{flex:1;min-width:0;}
.tarea .desc{font-size:15px;font-weight:600;line-height:1.35;margin-bottom:7px;word-break:break-word;}
.tarea.hecha .desc{text-decoration:line-through;color:var(--gris);font-weight:500;}
.tarea.hecha{background:#FAFCFE;}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.meta span{font-size:12px;color:var(--gris);display:inline-flex;align-items:center;gap:4px;}
.pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:8px;color:#fff;letter-spacing:.3px;}
.p-hoy{background:#FFF1CC;color:#7A5600;}
.p-venc{background:#FBDDDD;color:#9B1F1F;}
.p-urg{background:#FFE1DC;color:#A6301F;}
.p-ok{background:#DFF1E8;color:#15613F;}
.p-prox{background:#DFEBFA;color:#124A85;}
.p-ivy{background:#E4E9F5;color:#22376B;}
.acciones{display:flex;gap:6px;flex-shrink:0;flex-direction:column;}
.vacio{text-align:center;padding:40px 20px;color:var(--gris);font-size:14.5px;}
.bloque-tit{display:flex;align-items:center;gap:10px;margin:24px 0 11px;font-size:13.5px;font-weight:700;letter-spacing:.4px;color:var(--texto);}
.bloque-tit::after{content:'';flex:1;height:1px;background:var(--linea);}
.ayuda{font-size:13px;color:var(--gris);margin-bottom:12px;padding:0 2px;}
.arrastrando{opacity:.55;border-color:var(--azul) !important;border-style:dashed;}

/* ===== KPIs ===== */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px;}
.kpi{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;}
.kpi .n{font-size:24px;font-weight:800;line-height:1;}
.kpi .l{font-size:11px;color:var(--gris);margin-top:5px;letter-spacing:.4px;}
.chart-box{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);padding:16px;margin-bottom:14px;}
.chart-box h4{font-size:13px;font-weight:700;color:var(--texto);margin-bottom:12px;letter-spacing:.6px;text-transform:uppercase;}

/* ===== PERSONAS / CHIPS ===== */
.p-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--linea-sf);}
.p-row:last-child{border-bottom:none;}
.p-row .pn{flex:1;font-size:14.5px;font-weight:600;}
.p-tipo{font-size:10.5px;background:var(--linea-sf);color:var(--azul);padding:3px 9px;border-radius:8px;font-weight:600;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{cursor:pointer;padding:8px 14px;border-radius:11px;border:1.5px solid var(--linea);background:#fff;font-size:13px;font-weight:600;color:var(--texto);}
.chip.sel{background:var(--azul);border-color:var(--azul);color:#fff;}

/* ===== NOTAS ===== */
.nota{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:14px;margin-bottom:10px;}
.nota .nt{font-weight:700;color:var(--azul);font-size:15px;margin-bottom:3px;}
.nota .nf{font-size:11.5px;color:var(--gris);margin-bottom:8px;}
.nota .nx{font-size:14px;white-space:pre-wrap;line-height:1.5;}
.nota-acc{display:flex;gap:6px;margin-top:11px;}

/* ===== LISTAS ===== */
.lista-card{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.lista-card .ic{width:32px;display:flex;align-items:center;justify-content:center;color:var(--azul);font-size:22px;flex-shrink:0;}
.lista-card .inf{flex:1;min-width:0;}
.lista-card .nm{font-size:15px;font-weight:700;}
.lista-card .ct{font-size:12px;color:var(--gris);}
.item{background:var(--papel);border:1px solid var(--linea);border-radius:13px;padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;gap:11px;}
.item .asa{color:#A9BFD6;font-size:18px;cursor:grab;touch-action:none;flex-shrink:0;}
.check{width:24px;height:24px;border-radius:8px;border:2px solid #B9CCE0;background:#fff;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;}
.check.on{background:var(--ok);border-color:var(--ok);}
.item .tx{flex:1;font-size:14.5px;font-weight:500;word-break:break-word;}
.item.hecho .tx{text-decoration:line-through;color:var(--gris);}
.add-row{display:flex;gap:8px;margin-bottom:14px;}
.add-row input{flex:1;}

/* ===== POMODORO ===== */
.pomo{background:var(--papel);border:1px solid var(--linea);border-radius:20px;padding:22px;text-align:center;}
.pomo-time{font-size:56px;font-weight:800;color:var(--azul);letter-spacing:-2px;margin:18px 0;font-variant-numeric:tabular-nums;}
.dur-row{display:flex;gap:8px;}
.est-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.est-btn{border:none;cursor:pointer;font-size:13px;font-weight:600;padding:11px;border-radius:11px;color:#fff;}

/* ===== BIBLIOTECA ===== */
.elearn{background:var(--papel);border:1px solid var(--linea);border-radius:20px;padding:24px;text-align:center;min-height:290px;display:flex;flex-direction:column;justify-content:space-between;}
.elearn .ic{height:56px;display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--azul);margin:0 auto 12px;}
.elearn h3{font-size:19px;color:var(--azul);margin-bottom:11px;display:block;}
.elearn p{font-size:14.5px;line-height:1.6;color:var(--texto);}
.el-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--linea);}
.dot.on{background:var(--azul);}
.mini{border:none;cursor:pointer;padding:10px 17px;border-radius:11px;font-weight:600;color:#fff;font-size:14px;background:var(--azul);}
.mini[disabled]{background:var(--linea);color:var(--gris);cursor:default;}

/* ===== PANEL TEMAS ===== */
#panel{position:fixed;inset:0;background:rgba(9,28,56,.5);z-index:70;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:#fff;border-radius:24px 24px 0 0;padding:24px 20px 32px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;}
.sheet h3{font-size:17px;font-weight:700;color:var(--azul);margin-bottom:16px;}
.sub{font-size:11.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--azul-os);margin:18px 0 9px;}
.sub:first-of-type{margin-top:0;}
.tema-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.tema-op{border-radius:14px;padding:15px 12px;cursor:pointer;font-size:13.5px;font-weight:700;color:#fff;text-align:center;border:3px solid transparent;}
.tema-op.sel{border-color:var(--texto);}
.fondo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.fondo-op{border-radius:13px;padding:17px 6px;cursor:pointer;font-size:12px;font-weight:600;color:var(--texto);text-align:center;border:2.5px solid var(--linea);}
.fondo-op.sel{border-color:var(--azul);}
.hex-row{display:flex;gap:10px;align-items:center;margin-bottom:12px;}
.hex-row label{margin:0;flex:1;}
.hex-row input[type=color]{width:52px;height:42px;padding:3px;border-radius:11px;cursor:pointer;flex-shrink:0;}
.hex-row input[type=text]{width:112px;flex-shrink:0;text-transform:uppercase;font-size:14px;}

/* ===== SPINNER ===== */
#procesando{position:fixed;inset:0;z-index:90;background:rgba(9,28,56,.32);display:flex;align-items:center;justify-content:center;}
#procesando .sp{width:50px;height:50px;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:gira .7s linear infinite;}
@keyframes gira{to{transform:rotate(360deg);}}

/* ===== RULETA ===== */
#ruleta{position:fixed;inset:0;background:rgba(9,28,56,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;}
.ru-card{background:#fff;border-radius:24px;padding:30px 24px;text-align:center;max-width:330px;width:100%;}
.ru-mark{width:76px;height:76px;margin:0 auto 16px;}
.ru-mark svg{width:100%;height:100%;display:block;}
.ru-mark.late{animation:latido 1.2s ease-in-out infinite;}
@keyframes latido{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
.ru-btns{display:flex;flex-direction:column;gap:9px;margin-top:18px;}

#giro{position:fixed;inset:0;z-index:75;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;}
#giro.show{opacity:1;}
#giro .m{width:108px;height:108px;animation:giro7 1.2s cubic-bezier(.3,0,.2,1);}
#giro .m svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 26px rgba(10,40,90,.3));}
@keyframes giro7{0%{transform:rotate(0deg) scale(.55);opacity:0;}22%{opacity:1;}70%{opacity:1;}100%{transform:rotate(720deg) scale(1);opacity:0;}}
.card h3 i{font-size:19px;}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="login-mark" id="login-mark"></div>
    <div class="login-nombre">Sotelo<span>7</span></div>
    <div class="login-tag">Your Life in Balance</div>
    <div id="login-msg"></div>
    <div style="text-align:left;margin-bottom:13px"><label>Usuario</label><input type="text" id="in-user" placeholder="tu usuario" autocomplete="username"></div>
    <div style="text-align:left;margin-bottom:18px"><label>Contrase&ntilde;a</label><input type="password" id="in-pass" placeholder="tu contrase&ntilde;a" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
    <button class="btn btn-primario" style="width:100%" onclick="login()">Entrar</button>
  </div>
</div>

<div id="app" class="oculto">
  <header class="hdr">
    <button class="burger" id="burger" onclick="alternarMenu()" aria-label="Men&uacute;"><span></span><span></span><span></span></button>
    <div class="hdr-mark" id="hdr-mark"></div>
    <div class="hdr-txt"><h1>Sotelo7</h1><p>Your Life in Balance</p></div>
    <div class="hdr-acc">
      <button class="hdr-ib" id="btn-son" onclick="alternarSonido()" aria-label="Sonido"><i class="ti ti-volume-off"></i></button>
      <button class="hdr-ib" onclick="abrirPanel()" aria-label="Tema"><i class="ti ti-palette"></i></button>
      <button class="hdr-ib" onclick="salir()" aria-label="Salir"><i class="ti ti-logout"></i></button>
    </div>
  </header>

  <div id="overlay" onclick="cerrarMenu()"></div>

  <nav id="drawer" aria-label="Navegaci&oacute;n">
    <div class="dw-top">
      <div class="m" id="dw-mark"></div>
      <h2>Sotelo7</h2>
      <p>Your Life in Balance</p>
    </div>
    <div class="dw-nav" id="dw-nav"></div>
    <div class="dw-pie">7 pilares &middot; una vida en equilibrio</div>

/* ---------- utilidades ---------- */
function norm(s){ return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim(); }
function igual(a,b){ return norm(a)===norm(b); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function activa(t){ return !igual(t.estado,"Completada"); }
function hoyStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function esHoy(t){ return !!t.vencimiento && t.vencimiento===hoyStr(); }
function esVencida(t){ return !!t.vencimiento && activa(t) && t.vencimiento<hoyStr(); }
function esProxima(t){ return !!t.vencimiento && activa(t) && t.vencimiento>hoyStr(); }
function esUrgente(t){ return norm(t.urgente).charAt(0)==="s"; }

/* ---------- almacenamiento ---------- */
function gset(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function gget(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }
function guardarSesion(t){ gset("s7_sesion",JSON.stringify({token:t,exp:Date.now()+SESION_HORAS*3600*1000})); }
function leerSesion(){ try{ const s=JSON.parse(gget("s7_sesion","null")); if(s&&s.exp>Date.now())return s; }catch(e){} return null; }
function borrarSesion(){ try{ localStorage.removeItem("s7_sesion"); }catch(e){} }

/* ---------- temas ---------- */
const FONDOS={
  nube:{c:"#F4F8FD",n:"Nube"}, cielo:{c:"#E9F2FC",n:"Cielo"}, brisa:{c:"#E9F5F4",n:"Brisa"},
  arena:{c:"#FAF6EC",n:"Arena"}, lila:{c:"#F1EFFA",n:"Lila"}, perla:{c:"#F2F4F7",n:"Perla"}
};
function leerTema(){ return gget("s7_tema","sotelo7"); }
function leerFondo(){ const f=gget("s7_fondo","nube"); return FONDOS[f]?f:"nube"; }
function leerCustom(){
  try{ const c=JSON.parse(gget("s7_custom","null")); if(c&&c.header&&c.fondo)return c; }catch(e){}
  return {header:"#1B5FC2",fondo:"#F4F8FD"};
}
function rgbDe(h){ h=String(h).replace("#",""); return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; }
function hexValido(h){ return /^#?[0-9A-Fa-f]{6}$/.test(String(h).trim()); }
function normHex(h){ h=String(h).trim(); if(h.charAt(0)!=="#")h="#"+h; return h.toUpperCase(); }
function tono(h,p){
  const c=rgbDe(h);
  const f=function(v){ const n=Math.round(p<0? v*(1+p) : v+(255-v)*p); return Math.max(0,Math.min(255,n)); };
  return "#"+[f(c[0]),f(c[1]),f(c[2])].map(function(v){ return v.toString(16).padStart(2,"0"); }).join("").toUpperCase();
}
function luz(h){ const c=rgbDe(h); return (0.299*c[0]+0.587*c[1]+0.114*c[2])/255; }
function aplicarTema(){
  const r=document.documentElement.style, t=leerTema();
  if(t==="personalizado"){
    const c=leerCustom();
    r.setProperty("--azul",c.header);
    r.setProperty("--azul-cl",tono(c.header,0.20));
    r.setProperty("--azul-os",tono(c.header,-0.20));
    r.setProperty("--fondo",c.fondo);
    r.setProperty("--header-txt", luz(c.header)>0.65 ? "#16324F" : "#FFFFFF");
  } else {
    r.setProperty("--azul","#1B5FC2");
    r.setProperty("--azul-cl","#3B82E8");
    r.setProperty("--azul-os","#134A9E");
    r.setProperty("--fondo",FONDOS[leerFondo()].c);
    r.setProperty("--header-txt","#FFFFFF");
  }
}

/* ---------- sonido ---------- */
let _son=false, _audio=null;
function initAudio(){ if(!_audio){ try{ _audio=new Audio("beep.mp3"); _audio.preload="auto"; }catch(e){} } }
function beep(n){
  if(!_son)return; initAudio(); if(!_audio)return;
  let i=0;
  (function s(){ if(i>=n)return; try{ _audio.currentTime=0; const p=_audio.play(); if(p&&p.catch)p.catch(function(){}); }catch(e){} i++; if(i<n)setTimeout(s,250); })();
}
function alternarSonido(){
  initAudio(); _son=!_son; gset("s7_sonido",_son?"1":"0");
  const b=document.getElementById("btn-son");
  if(b)b.innerHTML=_son?ico("volume"):ico("volume-off");
  if(_son)beep(1);
}

/* ---------- API ---------- */
const ESCRITURA=["crearTarea","editarTarea","eliminarTarea","completarTarea","cambiarEstado","sumarPomodoro",
"ordenarIvy","guardarOrdenManual","crearPersona","editarPersona","eliminarPersona","crearNota","editarNota",
"eliminarNota","crearLista","crearItemLista","editarItemLista","toggleItemLista","eliminarItemLista",
"eliminarLista","guardarOrdenLista"];
function mostrarProc(){ const e=document.getElementById("procesando"); if(e)e.classList.remove("oculto"); }
function ocultarProc(){ const e=document.getElementById("procesando"); if(e)e.classList.add("oculto"); }
async function api(action, extra){
  const esc2=ESCRITURA.indexOf(action)!==-1;
  if(esc2)mostrarProc();
  try{
    const body=Object.assign({action:action, token:TOKEN}, extra||{});
    const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
    return await res.json();
  }catch(e){ return {ok:false,error:"Sin conexion"}; }
  finally{ if(esc2)ocultarProc(); }
}

/* ---------- sesion ---------- */
async function login(){
  initAudio();
  const u=document.getElementById("in-user").value.trim();
  const p=document.getElementById("in-pass").value.trim();
  const m=document.getElementById("login-msg"); m.innerHTML="";
  if(!u||!p){ m.innerHTML='<div class="msg msg-err">Escribe usuario y contrasena</div>'; return; }
  mostrarProc();
  try{
    const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"login",usuario:u,password:p})});
    const d=await res.json();
    if(d.ok){ TOKEN=d.token; guardarSesion(TOKEN); entrar(true); }
    else m.innerHTML='<div class="msg msg-err">'+esc(d.error||"No se pudo entrar")+'</div>';
  }catch(e){ m.innerHTML='<div class="msg msg-err">Error de conexion. Revisa la URL del script.</div>'; }
  finally{ ocultarProc(); }
}
function entrar(conRuleta){
  document.getElementById("login").classList.add("oculto");
  document.getElementById("app").classList.remove("oculto");
  aplicarTema();
  cargarTodo().then(function(){ construir(); if(conRuleta)abrirRuleta(); });
}
function salir(){
  TOKEN=null; borrarSesion(); cerrarMenu();
  document.getElementById("app").classList.add("oculto");
  document.getElementById("login").classList.remove("oculto");
  document.getElementById("in-pass").value="";
}
async function cargarTodo(){
  const r=await Promise.all([api("listarTareas"),api("listarPersonas"),api("dashboard"),api("listarNotas"),api("listarListas")]);
  TAREAS   = r[0]&&r[0].ok ? r[0].tareas   : [];
  PERSONAS = r[1]&&r[1].ok ? r[1].personas : [];
  DASH     = r[2]&&r[2].ok ? r[2].data     : null;
  NOTAS    = r[3]&&r[3].ok ? r[3].notas    : [];
  LISTAS   = r[4]&&r[4].ok ? r[4].listas   : [];
}
function personasOrdenadas(){ return PERSONAS.slice().sort(function(a,b){ return norm(a.nombre).localeCompare(norm(b.nombre)); }); }

/* ---------- secciones ---------- */

  {id:"f-prox",nom:"Proximas",ic:"calendar",f:function(){ return TAREAS.filter(esProxima); }},
  {id:"f-venc",nom:"Vencidas",ic:"alert-triangle",f:function(){ return TAREAS.filter(esVencida); }},

  {id:"f-prog",nom:"En progreso",ic:"progress",f:function(){ return TAREAS.filter(function(t){ return igual(t.estado,"En Progreso"); }); }},
  {id:"f-urg",nom:"Urgentes",ic:"flame",f:function(){ return TAREAS.filter(function(t){ return activa(t)&&esUrgente(t); }); }},

  {id:"m-sapo",nom:"Traguese ese Sapo",ic:"mountain",f:function(){ return TAREAS.filter(function(t){ return activa(t)&&igual(t.metodologia,"Traguese ese Sapo"); }); }},
  {id:"m-gtd",nom:"Metodo GTD",ic:"checklist",f:function(){ return TAREAS.filter(function(t){ return activa(t)&&igual(t.metodologia,"Metodo GTD"); }); }},
  {id:"m-ivy",nom:"Metodo Ivy Lee",ic:"list-numbers",f:function(){ return TAREAS.filter(function(t){ return activa(t)&&igual(t.metodologia,"Metodo Ivy Lee"); }); }},
  {id:"m-gen",nom:"Tareas Generales",ic:"circle-dot",f:function(){ return TAREAS.filter(function(t){ return activa(t)&&igual(t.metodologia,"Tareas Generales"); }); }}

  {id:"g-acciones",nom:"Acciones",ic:"bolt",col:"var(--azul)",tipo:"acciones",items:ACCIONES},

function ico(n){ return '<i class="ti ti-'+n+'"></i>'; }
function colorSec(id){
  if(id==="f-venc"||id==="f-urg")return "var(--coral)";
  if(id==="f-comp")return "var(--ok)";
  if(id==="f-hoy")return "var(--sol-os)";

/* ---------- drawer ---------- */
function abrirMenu(){
  document.getElementById("drawer").classList.add("open");
  document.getElementById("overlay").classList.add("show");
  document.getElementById("burger").classList.add("abierto");
}
function cerrarMenu(){
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("burger").classList.remove("abierto");
}
function alternarMenu(){
  const d=document.getElementById("drawer");
  if(d.classList.contains("open"))cerrarMenu(); else abrirMenu();
}
function mostrarGiro(){
  const g=document.getElementById("giro"); if(!g)return;
  g.classList.remove("show");
  const viejo=g.querySelector(".m");
  const nuevo=document.createElement("div");
  nuevo.className="m"; nuevo.innerHTML=marca();
  viejo.parentNode.replaceChild(nuevo,viejo);
  void nuevo.offsetWidth;
  g.classList.add("show");
  clearTimeout(window._gt);
  window._gt=setTimeout(function(){ g.classList.remove("show"); },1200);
}
function irAGrupo(gid){
  cerrarMenu(); beep(1); mostrarGiro();
  setTimeout(function(){ const el=document.getElementById(gid); if(el)el.scrollIntoView({behavior:"smooth",block:"start"}); },200);
}

/* ---------- construir menu ---------- */
function contarGrupo(g){
  if(g.tipo==="filtros")return g.items.reduce(function(a,s){ return a+s.f().length; },0);
  if(g.tipo==="notas")return NOTAS.length;
  if(g.tipo==="listas")return LISTAS.filter(function(x){ return x.tipo==="lista"; }).length;
  return g.items.length;
}
function construir(){
  let nav="";
  GRUPOS.forEach(function(g){
    nav+='<button class="dw-item" onclick="irAGrupo(\''+g.id+'\')">'+
      '<span class="ic">'+ico(g.ic)+'</span>'+
      '<span>'+g.nom+'</span><span class="ct">'+contarGrupo(g)+'</span></button>';
  });
  document.getElementById("dw-nav").innerHTML=nav;

  let h="";
  GRUPOS.forEach(function(g){
    h+='<div class="zona" id="'+g.id+'"><div class="zona-tit"><span class="ic">'+ico(g.ic)+'</span><h3>'+g.nom+'</h3></div>';
    if(g.tipo==="acciones"){
      h+='<div class="acc-grid">';
      g.items.forEach(function(s){ h+='<div class="acc" onclick="abrir(\''+s.id+'\')"><div class="dot">'+ico(s.ic)+'</div><div class="nm">'+s.nom+'</div></div>'; });
      h+='</div>';
    } else if(g.tipo==="filtros"){
      g.items.forEach(function(s){
        const n=s.f().length;
        h+='<div class="fila" onclick="abrir(\''+s.id+'\')"><div class="ic" style="color:'+colorSec(s.id)+'">'+ico(s.ic)+'</div>'+
           '<div class="inf"><div class="nm">'+s.nom+'</div><div class="ct">'+n+' tarea'+(n===1?"":"s")+'</div></div><div class="ch">'+ico("chevron-right")+'</div></div>';
      });
    } else if(g.tipo==="listas"){
      const ls=LISTAS.filter(function(x){ return x.tipo==="lista"; });
      h+='<div class="fila" onclick="abrir(\'listas\')"><div class="ic">'+ico("shopping-cart")+'</div>'+
         '<div class="inf"><div class="nm">Mis listas</div><div class="ct">'+ls.length+' lista'+(ls.length===1?"":"s")+'</div></div><div class="ch">'+ico("chevron-right")+'</div></div>';
    } else if(g.tipo==="notas"){
      h+='<div class="fila" onclick="abrir(\'notas\')"><div class="ic">'+ico("notes")+'</div>'+
         '<div class="inf"><div class="nm">Mis notas</div><div class="ct">'+NOTAS.length+' nota'+(NOTAS.length===1?"":"s")+'</div></div><div class="ch">'+ico("chevron-right")+'</div></div>';
    }
    h+='</div>';
  });
  document.getElementById("zonas").innerHTML=h;
}

/* ---------- navegacion de pantalla ---------- */
function abrir(id){
  beep(1); SECCION_ACTUAL=id;
  const s=TODAS.find(function(x){ return x.id===id; });
  let titulo = s ? s.nom : (id==="notas"?"Notas":(id==="listas"?"Mis listas":id));
  document.getElementById("pt-titulo").textContent=titulo;
  const b=document.getElementById("pt-body");
  if(id==="dashboard")      b.innerHTML=vDashboard();
  else if(id==="nueva")     { b.innerHTML=vNueva(); onMetodo("t"); }
  else if(id==="personas")  b.innerHTML=vPersonas();
  else if(id==="enfoque")   b.innerHTML=vEnfoque();
  else if(id==="biblioteca"){ b.innerHTML='<div id="el-cont"></div>'; leccion=0; pintarLeccion(); }
  else if(id==="notas")     b.innerHTML=vNotas();
  else if(id==="listas")    b.innerHTML=vListas();
  else if(id==="f-total")   { b.innerHTML=vTodas(); activarDragTareas(); }
  else if(id==="m-ivy")     b.innerHTML=vIvy();
  else                      b.innerHTML=vLista(s? s.f() : []);
  document.getElementById("pantalla").classList.add("activa");
  document.getElementById("pt-body").scrollTop=0;
  if(id==="dashboard")setTimeout(graficas,60);
}
function volver(){
  beep(1); LISTA_ACTUAL=null; SECCION_ACTUAL=null;
  document.getElementById("pantalla").classList.remove("activa");
  construir();
}
function refrescar(){
  if(SECCION_ACTUAL==="listas"&&LISTA_ACTUAL){ abrirLista(LISTA_ACTUAL); return; }
  if(SECCION_ACTUAL)abrir(SECCION_ACTUAL); else construir();
}

/* ---------- tarjeta de tarea (igual en todas las secciones) ---------- */
function tareaHTML(t,opt){
  opt=opt||{};
  const hecha=!activa(t);
  let pills="";
  if(hecha)pills+='<span class="pill p-ok">Completada</span>';
  else{
    if(esHoy(t))pills+='<span class="pill p-hoy">Hoy</span>';
    else if(esVencida(t))pills+='<span class="pill p-venc">Vencida</span>';
    else if(esProxima(t))pills+='<span class="pill p-prox">Proxima</span>';
    if(esUrgente(t))pills+='<span class="pill p-urg">Urgente</span>';
  }
  if(igual(t.metodologia,"Metodo Ivy Lee")&&t.ordenIvy)pills+='<span class="pill p-ivy">Ivy '+esc(t.ordenIvy)+'</span>';
  let meta="";
  if(t.persona&&t.persona!=="-")meta+='<span>'+ico("user")+' '+esc(t.persona)+'</span>';

/* ---------- arrastrar ---------- */
function crearDrag(contId, sel, alSoltar){
  const cont=document.getElementById(contId); if(!cont)return;
  let arr=null, tmr=null;
  function item(el){ while(el&&!(el.classList&&el.classList.contains(sel)))el=el.parentElement; return el; }
  function despues(y){
    const its=[].slice.call(cont.querySelectorAll("."+sel+":not(.arrastrando)"));
    let cerca=null, d=-Infinity;
    its.forEach(function(it){ const b=it.getBoundingClientRect(); const off=y-b.top-b.height/2; if(off<0&&off>d){ d=off; cerca=it; } });
    return cerca;
  }
  function mover(y){ const d=despues(y); if(d==null)cont.appendChild(arr); else cont.insertBefore(arr,d); }
  function fin(){
    if(!arr)return;
    arr.classList.remove("arrastrando"); arr=null;
    clearTimeout(tmr); tmr=setTimeout(alSoltar,500);
  }
  cont.addEventListener("mousedown",function(e){
    if(!e.target.classList.contains("asa"))return;
    arr=item(e.target); if(!arr)return; arr.classList.add("arrastrando"); e.preventDefault();
  });
  document.addEventListener("mousemove",function(e){ if(arr)mover(e.clientY); });
  document.addEventListener("mouseup",fin);
  cont.addEventListener("touchstart",function(e){
    if(!e.target.classList.contains("asa"))return;
    arr=item(e.target); if(arr)arr.classList.add("arrastrando");
  },{passive:true});
  cont.addEventListener("touchmove",function(e){ if(!arr)return; mover(e.touches[0].clientY); e.preventDefault(); },{passive:false});
  cont.addEventListener("touchend",fin);
}
function activarDragTareas(){

    const c=document.getElementById("drag-tareas"); if(!c)return;
    const orden=[].slice.call(c.querySelectorAll(".tarea")).map(function(el){ return Number(el.getAttribute("data-fila")); });
    if(!orden.length)return;
    await api("guardarOrdenManual",{orden:orden});

  });
}

async function guardarEdicionNota(id){
  const t=document.getElementById("en-texto").value.trim();
  if(!t){ alert("Escribe algo"); return; }
  const r=await api("editarNota",{id:id,nombre:document.getElementById("en-nombre").value.trim()||"Nota",texto:t});
  if(r.ok){ await cargarTodo(); abrir("notas"); } else alert(r.error||"No se pudo editar");
}
async function borrarNota(id){
  if(!confirm("Eliminar esta nota?"))return;
  const r=await api("eliminarNota",{id:id});
  if(r.ok){ await cargarTodo(); abrir("notas"); }
}

/* ---------- enfoque (pomodoro) ---------- */
let pFila=null,pTotal=0,pResta=0,pInt=null,pIni=null,pCorre=false;
function vEnfoque(){
  let o='<option value="">- elige una tarea -</option>';
  TAREAS.filter(activa).forEach(function(t){ o+='<option value="'+t.fila+'">'+esc(t.descripcion)+'</option>'; });
  let d="";
  [5,10,15,20,25,30,35,40,45,50,55,60].forEach(function(m){ d+='<option'+(m===25?" selected":"")+'>'+m+'</option>'; });
  return '<div class="pomo">'+
    '<div style="text-align:left;margin-bottom:13px"><label>Tarea</label><select id="p-sel">'+o+'</select></div>'+
    '<div style="text-align:left"><label>Duracion (min)</label><div class="dur-row">'+
    '<select id="p-dur" onchange="document.getElementById(\'p-man\').value=this.value">'+d+'</select>'+
    '<input type="number" id="p-man" min="1" max="180" value="25"></div></div>'+
    '<div class="pomo-time" id="p-time">25:00</div>'+
    '<div id="p-ctrl"><button class="btn btn-coral" style="width:100%" onclick="pIniciar()">Iniciar</button></div>'+
    '<div id="p-fin" class="oculto" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--linea)">'+
    '<div style="font-size:13px;color:var(--gris);margin-bottom:9px">Como queda la tarea?</div><div class="est-grid">'+
    '<button class="est-btn" style="background:var(--azul-cl)" onclick="pEstado(\'Pendiente\')">Pendiente</button>'+
    '<button class="est-btn" style="background:var(--azul)" onclick="pEstado(\'En Progreso\')">En progreso</button>'+
    '<button class="est-btn" style="background:var(--ok)" onclick="pEstado(\'Completada\')">Completada</button>'+
    '<button class="est-btn" style="background:var(--sol);color:#5A4300" onclick="pEstado(\'En Pausa\')">En pausa</button>'+
    '</div></div></div>';
}
function pPintar(){
  const m=String(Math.floor(pResta/60)).padStart(2,"0"), s=String(pResta%60).padStart(2,"0");
  const el=document.getElementById("p-time"); if(el)el.textContent=m+":"+s;
}
function pIniciar(){
  const sel=document.getElementById("p-sel");
  if(!sel.value){ alert("Elige una tarea primero"); return; }
  let min=parseInt(document.getElementById("p-man").value,10);
  if(!min||min<1)min=parseInt(document.getElementById("p-dur").value,10)||25;
  if(min>180)min=180;
  pFila=sel.value; pTotal=min*60; pResta=pTotal; pIni=Date.now(); pCorre=true; pPintar(); beep(3);
  document.getElementById("p-ctrl").innerHTML='<button class="btn btn-borde" style="width:100%" onclick="pDetener()">Detener</button>';
  clearInterval(pInt); pInt=setInterval(pTick,500);
}
function pTick(){
  if(!pCorre)return;
  pResta=pTotal-Math.floor((Date.now()-pIni)/1000);
  if(pResta<=0){ pResta=0; pPintar(); pTerminar(); } else pPintar();
}
async function pTerminar(){
  clearInterval(pInt); pCorre=false; beep(6);
  if(pFila)await api("sumarPomodoro",{fila:pFila,cantidad:1,duracion:Math.round(pTotal/60)});
  const c=document.getElementById("p-ctrl"); if(c)c.innerHTML='<div style="font-weight:700;color:var(--ok)">Sesion completada</div>';
  const f=document.getElementById("p-fin"); if(f)f.classList.remove("oculto");
  await cargarTodo();
}
function pDetener(){
  clearInterval(pInt); pCorre=false;
  const c=document.getElementById("p-ctrl"); if(c)c.innerHTML='<div style="font-weight:700;color:var(--coral)">Sesion detenida</div>';
  const f=document.getElementById("p-fin"); if(f)f.classList.remove("oculto");
}
async function pEstado(e){
  if(pFila)await api("cambiarEstado",{fila:pFila,estado:e});
  await cargarTodo(); pFila=null; abrir("enfoque");
}

  {t:"Metodo GTD",ic:"checklist",p:"Getting Things Done: saca todo de tu cabeza y ponlo en un sistema confiable. Para cada pendiente define la siguiente accion concreta. Asi tu mente se libera para enfocarse. Ideal para proyectos con muchas partes."},
  {t:"Metodo Ivy Lee",ic:"list-numbers",p:"Al terminar el dia escribe las 6 tareas mas importantes de manana en orden de prioridad. Al dia siguiente trabaja la primera hasta terminarla, luego la segunda. Nada de saltar. Simple y muy efectivo."},
  {t:"Tareas Generales",ic:"circle-dot",p:"Lo rutinario: llamadas, correos, tramites. Agrupalas, dales un momento del dia y sacalas rapido. Mantener esto ordenado evita que lo pequeno se acumule."},
  {t:"Los 7 pilares",ic:"sun",p:"Salud y bienestar, familia y relaciones, trabajo y profesion, finanzas, crecimiento personal, espiritualidad y proposito, descanso y recreacion. Una vida en equilibrio se sostiene en los siete, no en uno solo."}
];
let leccion=0;
function pintarLeccion(){
  const L=LECCIONES[leccion], c=document.getElementById("el-cont");
  if(!c)return;
  let d="";
  LECCIONES.forEach(function(x,i){ d+='<div class="dot'+(i===leccion?" on":"")+'"></div>'; });
  c.innerHTML='<div class="elearn"><div><div class="ic">'+ico(L.ic)+'</div><h3>'+L.t+'</h3><p>'+L.p+'</p></div>'+
    '<div><div class="dots">'+d+'</div><div class="el-nav">'+
    '<button class="mini"'+(leccion===0?" disabled":"")+' onclick="lecAnt()">Anterior</button>'+
    '<span style="font-size:12px;color:var(--gris)">'+(leccion+1)+' de '+LECCIONES.length+'</span>'+
    '<button class="mini"'+(leccion===LECCIONES.length-1?" disabled":"")+' onclick="lecSig()">Siguiente</button>'+
    '</div></div></div>';
}
function lecSig(){ if(leccion<LECCIONES.length-1){ leccion++; pintarLeccion(); } }
function lecAnt(){ if(leccion>0){ leccion--; pintarLeccion(); } }

/* ---------- panel de temas ---------- */
function abrirPanel(){
  const t=leerTema(), f=leerFondo(), c=leerCustom();
  let h='<div class="sub">Tema</div><div class="tema-grid">'+
    '<div class="tema-op'+(t==="sotelo7"?" sel":"")+'" style="background:linear-gradient(135deg,#1B5FC2,#3B82E8)" onclick="elegirTema(\'sotelo7\')">Sotelo7</div>'+
    '<div class="tema-op'+(t==="personalizado"?" sel":"")+'" style="background:linear-gradient(135deg,'+c.header+','+tono(c.header,0.25)+')" onclick="elegirTema(\'personalizado\')">Personalizado</div>'+
    '</div>';
  if(t==="personalizado"){
    h+='<div class="sub">Colores personalizados</div>'+
      '<div class="hex-row"><label>Encabezado</label><input type="color" id="cc-h" value="'+c.header+'" oninput="document.getElementById(\'cc-ht\').value=this.value.toUpperCase()"><input type="text" id="cc-ht" value="'+c.header+'" maxlength="7"></div>'+
      '<div class="hex-row"><label>Fondo</label><input type="color" id="cc-f" value="'+c.fondo+'" oninput="document.getElementById(\'cc-ft\').value=this.value.toUpperCase()"><input type="text" id="cc-ft" value="'+c.fondo+'" maxlength="7"></div>'+
      '<button class="btn btn-primario" style="width:100%" onclick="guardarCustom()">Aplicar colores</button>';
  } else {
    h+='<div class="sub">Fondo</div><div class="fondo-grid">';
    Object.keys(FONDOS).forEach(function(k){
      h+='<div class="fondo-op'+(k===f?" sel":"")+'" style="background:'+FONDOS[k].c+'" onclick="elegirFondo(\''+k+'\')">'+FONDOS[k].n+'</div>';
    });
    h+='</div>';
  }
  document.getElementById("panel-body").innerHTML=h;
  document.getElementById("panel").classList.remove("oculto");
}
function cerrarPanel(){ document.getElementById("panel").classList.add("oculto"); }
function elegirTema(t){ gset("s7_tema",t); aplicarTema(); abrirPanel(); construir(); }
function elegirFondo(k){ gset("s7_fondo",k); aplicarTema(); abrirPanel(); }
function guardarCustom(){
  let hh=document.getElementById("cc-ht").value, ff=document.getElementById("cc-ft").value;
  if(!hexValido(hh)||!hexValido(ff)){ alert("Usa colores en formato hexadecimal, por ejemplo #1B5FC2"); return; }
  hh=normHex(hh); ff=normHex(ff);
  gset("s7_custom",JSON.stringify({header:hh,fondo:ff}));
  gset("s7_tema","personalizado");
  aplicarTema(); construir(); cerrarPanel();
}
