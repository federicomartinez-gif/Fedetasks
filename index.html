<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1B5FC2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sotelo7 &middot; Your Life in Balance</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --azul:#1B5FC2; --azul-cl:#3B82E8; --azul-os:#134A9E; --azul-xs:#0E3573;
  --coral:#FF5A4A; --coral-os:#D93C2E;
  --sol:#FFC220; --sol-os:#D9A00F;
  --texto:#12293F; --gris:#4E6B87; --linea:#D5E3F3; --linea-sf:#EDF3FA;
  --papel:#FFFFFF; --fondo:#F4F8FD;
  --ok:#1F8A5A; --ok-os:#15613F; --venc:#C62828; --hoy:#FFC220; --urg:#FF5A4A;
  --header-txt:#FFFFFF;
  --r:16px; --tab-h:74px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--fondo);color:var(--texto);line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased;}
.oculto{display:none !important;}
button{font-family:inherit;}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--linea);border-radius:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--texto);outline:none;transition:border-color .15s;}
input[type="date"]{-webkit-appearance:none;appearance:none;display:block;min-height:49px;max-width:100%;}
input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0;}
input[type="date"]::-webkit-calendar-picker-indicator{margin-left:auto;}
input:focus,select:focus,textarea:focus{border-color:var(--azul);}
textarea{min-height:110px;resize:vertical;}
select option:disabled{color:#B3C2D2;}
label{display:block;font-size:12px;font-weight:600;color:var(--azul-os);margin-bottom:6px;letter-spacing:.3px;text-transform:uppercase;}

/* ===== BOTONES ===== */
.btn{border:none;cursor:pointer;padding:13px 20px;border-radius:13px;font-size:15px;font-weight:600;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s,transform .08s;}
.btn:active{transform:translateY(1px);}
.btn:hover{filter:brightness(1.06);}
.btn-primario{background:var(--azul);}
.btn-coral{background:var(--coral);}
.btn-ok{background:var(--ok);}
.btn-suave{background:var(--linea-sf);color:var(--azul);}
.btn-borde{background:transparent;border:1.5px solid var(--linea);color:var(--gris);}
.icon-btn{border:none;cursor:pointer;width:36px;height:36px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;color:#fff;background:var(--azul);transition:filter .15s;}
.icon-btn:hover{filter:brightness(1.08);}
.ib-ok{background:var(--ok);} .ib-del{background:#EDF3FA;color:#4E6B87;} .ib-edit{background:var(--azul-cl);}

/* ===== LOGIN (no cambia con el tema) ===== */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#0E3573 0%,#1B5FC2 55%,#3B82E8 100%);}
.login-card{background:#fff;border-radius:26px;padding:34px 26px 30px;width:100%;max-width:370px;box-shadow:0 22px 50px rgba(10,40,90,.28);text-align:center;}
.login-mark{width:96px;height:96px;margin:0 auto 16px;}
.login-mark svg{width:100%;height:100%;display:block;}
.login-nombre{font-size:31px;font-weight:800;letter-spacing:-1px;color:#1B5FC2;margin-bottom:2px;}
.login-nombre span{color:#FF5A4A;}
.login-tag{font-size:10.5px;letter-spacing:2.6px;color:#4E6B87;text-transform:uppercase;margin-bottom:24px;}
.msg{padding:11px 14px;border-radius:11px;font-size:13.5px;margin-bottom:14px;text-align:left;}
.msg-err{background:#FDECEC;color:#B62B2B;border:1px solid #F6C9C9;}

/* ===== HEADER ===== */
.hdr{position:sticky;top:0;z-index:40;background:var(--azul);color:var(--header-txt);padding:11px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 14px rgba(10,40,90,.18);}
.burger{width:40px;height:40px;border:none;border-radius:12px;background:rgba(255,255,255,.16);color:var(--header-txt);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex-shrink:0;}
.burger span{display:block;width:18px;height:2px;background:currentColor;border-radius:2px;transition:transform .25s,opacity .2s;}
.burger.abierto span:nth-child(1){transform:translateY(6px) rotate(45deg);}
.burger.abierto span:nth-child(2){opacity:0;}
.burger.abierto span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}
.hdr-mark{width:34px;height:34px;flex-shrink:0;}
.hdr-mark svg{width:100%;height:100%;display:block;border-radius:9px;}
.hdr-txt{flex:1;min-width:0;}
.hdr-txt h1{font-size:17px;font-weight:700;letter-spacing:-.3px;line-height:1.1;}
.hdr-txt p{font-size:9.5px;opacity:.78;letter-spacing:1.4px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-acc{display:flex;gap:6px;flex-shrink:0;}
.hdr-ib{width:36px;height:36px;border:none;border-radius:11px;background:rgba(255,255,255,.18);color:var(--header-txt);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.hdr-ib img{width:100%;height:100%;object-fit:cover;border-radius:11px;}

/* ===== DRAWER ===== */
#overlay{position:fixed;inset:0;background:rgba(9,28,56,.45);z-index:48;opacity:0;pointer-events:none;transition:opacity .25s;}
#overlay.show{opacity:1;pointer-events:auto;}
#drawer{position:fixed;top:0;left:0;bottom:0;width:272px;max-width:82vw;background:#fff;z-index:49;transform:translateX(-102%);transition:transform .27s cubic-bezier(.4,0,.2,1);box-shadow:4px 0 26px rgba(10,40,90,.2);display:flex;flex-direction:column;}
#drawer.open{transform:translateX(0);}
.dw-top{background:var(--azul);color:#fff;padding:18px 18px 16px;}
.dw-top .m{width:42px;height:42px;margin-bottom:9px;}
.dw-top .m svg{width:100%;height:100%;border-radius:12px;display:block;}
.dw-top h2{font-size:19px;font-weight:800;letter-spacing:-.4px;}
.dw-top p{font-size:9.5px;opacity:.78;letter-spacing:1.8px;text-transform:uppercase;}
.dw-rot{font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--azul-os);padding:14px 16px 6px;}
.dw-nav{flex:1;overflow-y:auto;padding:0 10px 10px;}
.dw-item{width:100%;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:13px;font-size:15px;font-weight:600;color:var(--texto);text-align:left;transition:background .15s;}
.dw-item:hover{background:var(--linea-sf);}
.dw-item.on{background:var(--linea-sf);color:var(--azul-os);}
.dw-item .ic{width:26px;display:flex;align-items:center;justify-content:center;color:var(--azul);font-size:21px;flex-shrink:0;}
.dw-item .ct{margin-left:auto;font-size:12px;font-weight:700;color:var(--azul-os);background:var(--linea-sf);padding:2px 9px;border-radius:9px;}
.dw-item.on .ct{background:#fff;}
.dw-pie{padding:11px 16px;border-top:1px solid var(--linea);font-size:10.5px;color:var(--gris);line-height:1.5;}

/* ===== CONTENIDO ===== */
.wrap{padding:16px 14px calc(var(--tab-h) + 34px);max-width:760px;margin:0 auto;}
.dim-cinta{display:flex;align-items:center;gap:10px;background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);padding:13px 15px;margin-bottom:18px;}
.dim-cinta .ic{width:40px;height:40px;border-radius:12px;background:var(--linea-sf);color:var(--azul);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.dim-cinta .inf{flex:1;min-width:0;}
.dim-cinta .nm{font-size:16px;font-weight:700;letter-spacing:-.2px;}
.dim-cinta .ct{font-size:12.5px;color:var(--gris);}
.zona{margin-bottom:26px;scroll-margin-top:76px;}
.zona-tit{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-left:2px;}
.zona-tit .ic{display:flex;align-items:center;justify-content:center;color:var(--azul);font-size:19px;}
.zona-tit h3{font-size:13.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--azul-os);}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:10px;}
.acc{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);padding:15px 10px;text-align:center;cursor:pointer;transition:transform .12s,box-shadow .15s;}
.acc:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,60,120,.1);}
.acc .dot{height:42px;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;color:var(--azul);font-size:27px;}
.acc .nm{font-size:12.5px;font-weight:600;line-height:1.25;}
.fila{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px;transition:border-color .15s,transform .12s;}
.fila:hover{border-color:var(--azul-cl);transform:translateX(2px);}
.fila .ic{width:32px;display:flex;align-items:center;justify-content:center;color:var(--azul);font-size:22px;flex-shrink:0;}
.fila .inf{flex:1;min-width:0;}
.fila .nm{font-size:14.5px;font-weight:600;}
.fila .ct{font-size:12.5px;color:var(--gris);}
.fila .ch{color:#A9BFD6;font-size:18px;display:flex;align-items:center;}

/* ===== PANTALLA ===== */
#pantalla{position:fixed;inset:0;background:var(--fondo);z-index:60;transform:translateX(100%);transition:transform .27s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;}
#pantalla.activa{transform:translateX(0);}
.pt-top{background:var(--azul);color:#fff;padding:13px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 14px rgba(10,40,90,.16);flex-shrink:0;}
.pt-top .volver{width:38px;height:38px;border:none;border-radius:12px;background:rgba(255,255,255,.2);color:#fff;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pt-top .tt{flex:1;min-width:0;}
.pt-top h2{font-size:17px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pt-top .sb{font-size:10px;opacity:.8;letter-spacing:1.2px;text-transform:uppercase;}
.pt-body{flex:1;overflow-y:auto;padding:16px 14px calc(var(--tab-h) + 40px);}
.pt-body>*{max-width:760px;margin-left:auto;margin-right:auto;}

/* ===== TAB BAR ===== */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:66;background:var(--papel);border-top:1px solid var(--linea);display:flex;align-items:flex-start;
  padding:10px 2px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -3px 20px rgba(10,40,90,.08);}
#tabbar button{flex:1;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;color:var(--gris);font-size:10px;font-weight:600;letter-spacing:.1px;padding:0;line-height:1;min-width:0;}
#tabbar button .cara{height:30px;display:flex;align-items:center;justify-content:center;}
#tabbar button i{font-size:23px;}
#tabbar button span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
#tabbar button.on{color:var(--azul);}
#tabbar button .fotomini{width:25px;height:25px;border-radius:50%;object-fit:cover;border:1.5px solid var(--linea);}
#tabbar button.on .fotomini{border-color:var(--azul);}
/* Nueva tarea: mayor jerarquia, a la misma altura que el resto */
#tb-nueva{color:var(--azul);font-size:10.5px;font-weight:700;}
#tb-nueva .cara{width:54px;height:30px;border-radius:15px;background:var(--azul);color:#fff;box-shadow:0 3px 10px rgba(27,95,194,.28);}
#tb-nueva i{font-size:22px;}
#tb-nueva.on .cara{filter:brightness(1.08);}

/* ===== TARJETAS ===== */
.card{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);padding:18px;margin-bottom:14px;}
.card h3{font-size:15.5px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:9px;color:var(--azul);}
.card h3 i{font-size:19px;}
.form-grid{display:flex;flex-direction:column;gap:14px;margin-bottom:16px;}

/* ===== TAREA ===== */
.tarea{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:13px 14px;margin-bottom:9px;display:flex;align-items:flex-start;gap:11px;}
.tarea .asa{color:#A9BFD6;font-size:19px;cursor:grab;flex-shrink:0;padding-top:2px;touch-action:none;}
.tarea .cuerpo{flex:1;min-width:0;cursor:pointer;}
.tarea .desc{font-size:15px;font-weight:600;line-height:1.35;margin-bottom:5px;word-break:break-word;}
.tarea .det{font-size:12.5px;color:var(--gris);margin-bottom:7px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.tarea.hecha .desc{text-decoration:line-through;color:var(--gris);font-weight:500;}
.tarea.hecha{background:#FAFCFE;}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.meta span{font-size:12px;color:var(--gris);display:inline-flex;align-items:center;gap:4px;}
.pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:8px;letter-spacing:.3px;}
.p-hoy{background:#FFF1CC;color:#7A5600;}
.p-venc{background:#FBDDDD;color:#9B1F1F;}
.p-urg{background:#FFE1DC;color:#A6301F;}
.p-ok{background:#DFF1E8;color:#15613F;}
.p-prox{background:#DFEBFA;color:#124A85;}
.p-seis{background:#E4E9F5;color:#22376B;}
.p-dim{background:#EEF3F8;color:#2F4A66;}
.acciones{display:flex;gap:6px;flex-shrink:0;flex-direction:column;}
.vacio{text-align:center;padding:40px 20px;color:var(--gris);font-size:14.5px;}
.bloque-tit{display:flex;align-items:center;gap:10px;margin:24px 0 11px;font-size:13.5px;font-weight:700;letter-spacing:.4px;color:var(--texto);}
.bloque-tit::after{content:'';flex:1;height:1px;background:var(--linea);}
.ayuda{font-size:13px;color:var(--gris);margin-bottom:12px;padding:0 2px;line-height:1.5;}
.arrastrando{opacity:.55;border-color:var(--azul) !important;border-style:dashed;}
.barra-orden{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.tag-orden{font-size:11.5px;font-weight:600;color:var(--gris);background:var(--linea-sf);padding:6px 11px;border-radius:9px;}
.link-orden{border:none;background:transparent;color:var(--azul);font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:underline;padding:4px 2px;}

/* ===== KPIs ===== */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px;}
.kpi{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;}
.kpi .n{font-size:24px;font-weight:800;line-height:1;}
.kpi .l{font-size:11px;color:var(--gris);margin-top:5px;letter-spacing:.4px;}
.chart-box{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);padding:16px;margin-bottom:14px;}
.chart-box h4{font-size:13px;font-weight:700;color:var(--texto);margin-bottom:12px;letter-spacing:.6px;text-transform:uppercase;}

/* ===== PERSONAS / CHIPS ===== */
.p-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--linea-sf);}
.p-row:last-child{border-bottom:none;}
.p-row .pn{flex:1;font-size:14.5px;font-weight:600;}
.p-tipo{font-size:10.5px;background:var(--linea-sf);color:var(--azul);padding:3px 9px;border-radius:8px;font-weight:600;}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-height:152px;overflow-y:auto;padding:3px;border:1.5px solid var(--linea);border-radius:14px;background:#fff;align-content:flex-start;}
.chips::-webkit-scrollbar{width:5px;}
.chips::-webkit-scrollbar-thumb{background:var(--linea);border-radius:4px;}
.chip{cursor:pointer;padding:9px 14px;border-radius:11px;border:1.5px solid var(--linea);background:#fff;font-size:13px;font-weight:600;color:var(--texto);white-space:nowrap;}
.chip.sel{background:var(--azul);border-color:var(--azul);color:#fff;}
.chips-nota{font-size:11.5px;color:var(--gris);margin:7px 0 0 2px;}

/* ===== NOTAS ===== */
.nota{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:14px;margin-bottom:10px;}
.nota .nt{font-weight:700;color:var(--azul);font-size:15px;margin-bottom:3px;}
.nota .nf{font-size:11.5px;color:var(--gris);margin-bottom:8px;}
.nota .nx{font-size:14px;white-space:pre-wrap;line-height:1.5;}
.nota-acc{display:flex;gap:6px;margin-top:11px;}

/* ===== LISTAS ===== */
.lista-card{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.lista-card .ic{width:32px;display:flex;align-items:center;justify-content:center;color:var(--azul);font-size:22px;flex-shrink:0;}
.lista-card .inf{flex:1;min-width:0;}
.lista-card .nm{font-size:15px;font-weight:700;}
.lista-card .ct{font-size:12px;color:var(--gris);}
.item{background:var(--papel);border:1px solid var(--linea);border-radius:13px;padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;gap:11px;}
.item .asa{color:#A9BFD6;font-size:18px;cursor:grab;touch-action:none;flex-shrink:0;}
.check{width:24px;height:24px;border-radius:8px;border:2px solid #B9CCE0;background:#fff;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;}
.check.on{background:var(--ok);border-color:var(--ok);}
.item .tx{flex:1;font-size:14.5px;font-weight:500;word-break:break-word;}
.item.hecho .tx{text-decoration:line-through;color:var(--gris);}
.add-row{display:flex;gap:8px;margin-bottom:14px;}
.add-row input{flex:1;}

/* ===== POMODORO ===== */
.pomo{background:var(--papel);border:1px solid var(--linea);border-radius:20px;padding:22px;text-align:center;}
.pomo-time{font-size:56px;font-weight:800;color:var(--azul);letter-spacing:-2px;margin:18px 0;font-variant-numeric:tabular-nums;}
.dur-row{display:flex;gap:8px;}
.est-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.est-btn{border:none;cursor:pointer;font-size:13px;font-weight:600;padding:11px;border-radius:11px;color:#fff;}

/* ===== BIBLIOTECA ===== */
.elearn{background:var(--papel);border:1px solid var(--linea);border-radius:20px;padding:26px 22px 22px;display:flex;flex-direction:column;}
.elearn .ic{width:62px;height:62px;border-radius:20px;background:var(--linea-sf);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--azul);margin:0 auto 14px;}
.elearn h3{font-size:20px;color:var(--azul);margin-bottom:16px;display:block;text-align:center;letter-spacing:-.3px;line-height:1.25;}
.elearn .entrada{font-size:15px;line-height:1.68;color:var(--texto);}
.elearn .entrada+.lec-lista{margin-top:16px;}
.lec-lista{display:flex;flex-direction:column;gap:11px;}
.lec-it{display:flex;gap:11px;align-items:flex-start;}
.lec-it .bala{width:9px;height:9px;border-radius:50%;background:var(--coral);flex-shrink:0;margin-top:7px;}
.lec-it .num{width:22px;height:22px;border-radius:8px;background:var(--linea-sf);color:var(--azul-os);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.lec-it .cont{flex:1;min-width:0;}
.lec-it .tt{font-size:14.5px;font-weight:700;color:var(--texto);line-height:1.4;}
.lec-it .dd{font-size:13.5px;color:var(--gris);line-height:1.55;margin-top:2px;}
.elearn .cierre{font-size:14.5px;line-height:1.65;color:var(--texto);margin-top:16px;padding-top:14px;border-top:1px solid var(--linea-sf);}
.elearn .fuente{font-size:12px;color:var(--gris);margin-top:16px;line-height:1.55;background:var(--linea-sf);border-radius:12px;padding:11px 13px;}

@keyframes giro7{0%{transform:rotate(0deg) scale(.55);opacity:0;}22%{opacity:1;}70%{opacity:1;}100%{transform:rotate(720deg) scale(1);opacity:0;}}

/* ===== CELEBRACION ===== */

@keyframes dibujaAro{to{stroke-dashoffset:0;}}
.cel-anillo .palo{stroke-dasharray:70;stroke-dashoffset:70;animation:dibujaPalo .4s ease-out .5s forwards;}
@keyframes dibujaPalo{to{stroke-dashoffset:0;}}
.cel-txt{font-size:25px;font-weight:800;color:var(--azul);letter-spacing:-.6px;margin-bottom:6px;}
.cel-sub{font-size:14px;color:var(--gris);line-height:1.5;}
.cel-chispa{position:absolute;width:9px;height:9px;border-radius:50%;opacity:0;}
@keyframes chispa{0%{opacity:0;transform:translate(0,0) scale(.4);}30%{opacity:1;}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.15);}}
</style>

<script>
/* ============ SOTELO7 · app.js (v9) ============ */
const API_URL = "https://script.google.com/macros/s/AKfycbxU2mXjM8sGaMsPLEIim4Tq9tuc-5S6iCZdX9JQkWP1klpl7BLf-d9N_8h5kTZxxDT74g/exec";
const SESION_HORAS = 12;

let TOKEN=null, TAREAS=[], PERSONAS=[], NOTAS=[], LISTAS=[], DASH=null, PREFS={};
let DIM="General";
let LISTA_ACTUAL=null, SECCION_ACTUAL=null, TAREA_ACTUAL=null;

/* ---------- utilidades ---------- */
function norm(s){ return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim(); }
function igual(a,b){ return norm(a)===norm(b); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function activa(t){ return !igual(t.estado,"Completada"); }
function hoyStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function esHoy(t){ return !!t.vencimiento && t.vencimiento===hoyStr(); }
function esVencida(t){ return !!t.vencimiento && activa(t) && t.vencimiento<hoyStr(); }
function esProxima(t){ return !!t.vencimiento && activa(t) && t.vencimiento>hoyStr(); }
function esUrgente(t){ return norm(t.urgente).charAt(0)==="s"; }
function ico(n){ return '<i class="ti ti-'+n+'"></i>'; }

/* ---------- dimensiones ---------- */
const DIMENSIONES=[
  {id:"General",       ic:"layout-grid", desc:"Todo junto. Lo que no clasificaste y el resumen de las siete."},

  {id:"Finanzas",      ic:"coins",       desc:"Pagos, presupuesto, ahorro e inversiones."},
  {id:"Aprendizaje",   ic:"book-2",      desc:"Estudios, cursos, lectura y desarrollo personal."},
  {id:"Espiritualidad",ic:"sparkles",    desc:"Fe, oracion, reflexion, servicio y sentido de vida."}
];
function dimInfo(id){ return DIMENSIONES.find(function(d){ return igual(d.id,id||"General"); }) || DIMENSIONES[0]; }
function esGeneral(){ return igual(DIM,"General"); }
function enDim(x){ return esGeneral() ? true : igual(x.dimension||"General", DIM); }

/* ---------- enfoques de trabajo ---------- */
const ENFOQUES=[
  {id:"Primero lo dificil", nom:"Primero lo dif\u00edcil", ic:"mountain"},

}
/* En tema personalizado la marca de la app se vuelve neutra para acoplarse a cualquier color.
   El login siempre conserva la marca original. */
function modoMarcaApp(){ return leerTema()==="personalizado" ? "suave" : "color"; }
function modoMarcaClara(){ return leerTema()==="personalizado" ? "medio" : "color"; }

/* ---------- almacenamiento ---------- */
function gset(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function gget(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }
function guardarSesion(t){ gset("s7_sesion",JSON.stringify({token:t,exp:Date.now()+SESION_HORAS*3600*1000})); }
function leerSesion(){ try{ const s=JSON.parse(gget("s7_sesion","null")); if(s&&s.exp>Date.now())return s; }catch(e){} return null; }

const FONDOS={
  nube:{c:"#F4F8FD",n:"Nube"}, cielo:{c:"#E9F2FC",n:"Cielo"}, brisa:{c:"#E9F5F4",n:"Brisa"},

function leerTema(){ return gget("s7_tema","sotelo7"); }
function leerFondo(){ const f=gget("s7_fondo","nube"); return FONDOS[f]?f:"nube"; }
function leerCustom(){
  try{ const c=JSON.parse(gget("s7_custom","null")); if(c&&c.header&&c.fondo)return c; }catch(e){}
  return {header:"#1B5FC2",fondo:"#F4F8FD"};
}
function rgbDe(h){ h=String(h).replace("#",""); return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; }
function hexValido(h){ return /^#?[0-9A-Fa-f]{6}$/.test(String(h).trim()); }
function normHex(h){ h=String(h).trim(); if(h.charAt(0)!=="#")h="#"+h; return h.toUpperCase(); }
function tono(h,p){
  const c=rgbDe(h);
  const f=function(v){ const n=Math.round(p<0? v*(1+p) : v+(255-v)*p); return Math.max(0,Math.min(255,n)); };
  return "#"+[f(c[0]),f(c[1]),f(c[2])].map(function(v){ return v.toString(16).padStart(2,"0"); }).join("").toUpperCase();
}
function luz(h){ const c=rgbDe(h); return (0.299*c[0]+0.587*c[1]+0.114*c[2])/255; }
function aplicarColores(header,fondo){
  const r=document.documentElement.style;
  r.setProperty("--azul",header);
  r.setProperty("--azul-cl",tono(header,0.20));
  r.setProperty("--azul-os",tono(header,-0.20));
  r.setProperty("--fondo",fondo);
  r.setProperty("--header-txt", luz(header)>0.65 ? "#16324F" : "#FFFFFF");
}
function aplicarTema(){
  const t=leerTema();
  if(t==="personalizado"){ const c=leerCustom(); aplicarColores(c.header,c.fondo); }
  else{
    const r=document.documentElement.style;
    r.setProperty("--azul","#1B5FC2"); r.setProperty("--azul-cl","#3B82E8");
    r.setProperty("--azul-os","#134A9E"); r.setProperty("--fondo",FONDOS[leerFondo()].c);
    r.setProperty("--header-txt","#FFFFFF");
  }
  const mt=document.querySelector('meta[name="theme-color"]');
  if(mt)mt.setAttribute("content", t==="personalizado"?leerCustom().header:"#1B5FC2");
  repintarMarcas();
}

/* ---------- sonido ---------- */
let _son=false, _audio=null;
function initAudio(){ if(!_audio){ try{ _audio=new Audio("beep.mp3"); _audio.preload="auto"; }catch(e){} } }
function beep(n){
  if(!_son)return; initAudio(); if(!_audio)return;
  let i=0;
  (function s(){ if(i>=n)return; try{ _audio.currentTime=0; const p=_audio.play(); if(p&&p.catch)p.catch(function(){}); }catch(e){} i++; if(i<n)setTimeout(s,250); })();
}
function alternarSonido(){
  initAudio(); _son=!_son; gset("s7_sonido",_son?"1":"0");
  const b=document.getElementById("btn-son");
  if(b)b.innerHTML=_son?ico("volume"):ico("volume-off");
  if(_son)beep(1);
}

const ESCRITURA=["crearTarea","editarTarea","eliminarTarea","completarTarea","cambiarEstado","sumarPomodoro",
"guardarOrdenSeis","guardarOrdenManual","restaurarOrdenAuto","eliminarCompletadas","crearPersona","editarPersona",
"eliminarPersona","crearNota","editarNota","eliminarNota","crearLista","crearItemLista","editarItemLista",
"toggleItemLista","eliminarItemLista","eliminarLista","guardarOrdenLista","guardarPref","guardarFotoPerfil","eliminarFotoPerfil"];
function mostrarProc(){ const e=document.getElementById("procesando"); if(e)e.classList.remove("oculto"); }
function ocultarProc(){ const e=document.getElementById("procesando"); if(e)e.classList.add("oculto"); }
async function api(action, extra){
  const esW=ESCRITURA.indexOf(action)!==-1;
  if(esW)mostrarProc();
  try{
    const body=Object.assign({action:action, token:TOKEN}, extra||{});
    const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
    return await res.json();
  }catch(e){ return {ok:false,error:"Sin conexion"}; }
  finally{ if(esW)ocultarProc(); }
}

/* ---------- sesion ---------- */
async function login(){
  initAudio();
  const u=document.getElementById("in-user").value.trim();
  const p=document.getElementById("in-pass").value.trim();
  const m=document.getElementById("login-msg"); m.innerHTML="";
  if(!u||!p){ m.innerHTML='<div class="msg msg-err">Escribe usuario y contrasena</div>'; return; }
  mostrarProc();
  try{
    const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"login",usuario:u,password:p})});
    const d=await res.json();
    if(d.ok){ TOKEN=d.token; PREFS=d.prefs||{}; guardarSesion(TOKEN); entrar(true); }
    else m.innerHTML='<div class="msg msg-err">'+esc(d.error||"No se pudo entrar")+'</div>';
  }catch(e){ m.innerHTML='<div class="msg msg-err">Error de conexion. Revisa la URL del script.</div>'; }
  finally{ ocultarProc(); }
}

function personasOrdenadas(){ return PERSONAS.slice().sort(function(a,b){ return norm(a.nombre).localeCompare(norm(b.nombre)); }); }

/* ---------- orden de tareas ---------- */
function modoOrden(){ return (PREFS["orden:"+DIM]==="manual") ? "manual" : "auto"; }
function ordenar(lista){
  const arr=lista.slice();
  if(modoOrden()==="manual"){
    arr.sort(function(a,b){
      const x=Number(a.ordenManual)||9999, y=Number(b.ordenManual)||9999;
      if(x!==y)return x-y;
      return a.fila-b.fila;
    });
    return arr;
  }
  arr.sort(function(a,b){
    const av=a.vencimiento||"", bv=b.vencimiento||"";
    if(av&&bv){ if(av!==bv)return av<bv?-1:1; }
    else if(av&&!bv)return -1;
    else if(!av&&bv)return 1;
    const au=esUrgente(a)?0:1, bu=esUrgente(b)?0:1;
    if(au!==bu)return au-bu;
    return a.fila-b.fila;
  });
  return arr;
}
function ordenarSeis(lista){
  return lista.slice().sort(function(a,b){
    const x=Number(a.ordenSeis)||99, y=Number(b.ordenSeis)||99;
    if(x!==y)return x-y;
    return a.fila-b.fila;
  });
}
function seisActivas(){ return TAREAS.filter(function(t){ return esSeis(t)&&activa(t); }); }
function posicionesSeisOcupadas(excluirFila){
  const map={};
  seisActivas().forEach(function(t){
    if(excluirFila&&Number(t.fila)===Number(excluirFila))return;
    const p=Number(t.ordenSeis); if(p>=1&&p<=LIMITE_SEIS)map[p]=t.descripcion;
  });
  return map;
}

/* ---------- construir ---------- */
function cuentaDim(id){
  const prev=DIM; DIM=id;
  const n=TAREAS.filter(function(t){ return enDim(t)&&activa(t); }).length;
  DIM=prev; return n;
}
function contarGrupo(g){
  if(g.tipo==="filtros")return g.items.reduce(function(a,s){ return a+s.f().length; },0);
  if(g.tipo==="notas")return NOTAS.filter(enDim).length;
  if(g.tipo==="listas")return LISTAS.filter(function(x){ return x.tipo==="lista"&&enDim(x); }).length;
  return g.items.length;
}
function construir(){
  let nav="";
  DIMENSIONES.forEach(function(d){
    nav+='<button class="dw-item'+(igual(d.id,DIM)?" on":"")+'" onclick="irADimension(\''+d.id+'\')">'+
      '<span class="ic">'+ico(d.ic)+'</span><span>'+d.id+'</span>'+
      '<span class="ct">'+cuentaDim(d.id)+'</span></button>';
  });
  document.getElementById("dw-nav").innerHTML=nav;

  const di=dimInfo(DIM);
  document.getElementById("hdr-dim").textContent=DIM;
  const activasDim=tareasDim().filter(activa).length;
  document.getElementById("cinta").innerHTML=
    '<div class="dim-cinta"><div class="ic">'+ico(di.ic)+'</div>'+
    '<div class="inf"><div class="nm">'+di.id+'</div><div class="ct">'+activasDim+' tarea'+(activasDim===1?"":"s")+' activa'+(activasDim===1?"":"s")+' &middot; '+esc(di.desc)+'</div></div></div>';

  let h="";
  GRUPOS.forEach(function(g){
    h+='<div class="zona" id="'+g.id+'"><div class="zona-tit"><span class="ic">'+ico(g.ic)+'</span><h3>'+g.nom+'</h3></div>';
    if(g.tipo==="acciones"){
      h+='<div class="acc-grid">';
      g.items.forEach(function(s){ h+='<div class="acc" onclick="abrir(\''+s.id+'\')"><div class="dot">'+ico(s.ic)+'</div><div class="nm">'+s.nom+'</div></div>'; });
      h+='</div>';
    } else if(g.tipo==="filtros"){
      g.items.forEach(function(s){
        const n=s.f().length;

        h+='<div class="fila" onclick="abrir(\''+s.id+'\')"><div class="ic" style="color:'+colorSec(s.id)+'">'+ico(s.ic)+'</div>'+
           '<div class="inf"><div class="nm">'+s.nom+'</div><div class="ct">'+n+' tarea'+(n===1?"":"s")+extra+'</div></div><div class="ch">'+ico("chevron-right")+'</div></div>';

/* ---------- navegacion de pantalla ---------- */
function abrir(id){
  beep(1); SECCION_ACTUAL=id;
  const s=TODAS.find(function(x){ return x.id===id; });
  let titulo = s ? s.nom : ({notas:"Notas",listas:"Mis listas",perfil:"Perfil",detalle:"Detalle de la tarea"}[id]||id);
  document.getElementById("pt-titulo").textContent=titulo;
  document.getElementById("pt-sub").textContent=DIM;
  const b=document.getElementById("pt-body");

  if(id==="dashboard")        pintarDashboard(b);
  else if(id==="nueva")       pintarNueva(b);
  else if(id==="personas")    pintarPersonas(b);
  else if(id==="enfoque")     pintarPomodoro(b);
  else if(id==="biblioteca")  pintarBiblioteca(b);
  else if(id==="social")      pintarSocial(b);
  else if(id==="notas")       pintarNotas(b);
  else if(id==="listas")      pintarListas(b);
  else if(id==="perfil")      pintarPerfil(b);
  else if(s&&s.porPersona)    pintarPorPersona(b,s);
  else if(s&&s.f)             pintarFiltro(b,s);
  else b.innerHTML='<div class="vacio">Seccion no disponible</div>';

  document.getElementById("pantalla").classList.add("activa");
  b.scrollTop=0;
  if(id==="nueva")marcarTab("tb-nueva");
  else if(id==="enfoque")marcarTab("tb-enfoque");
  else if(id==="perfil")marcarTab("tb-perfil");
  else if(id==="dashboard")marcarTab("tb-resumen");
  else marcarTab("");
}
function volver(){
  document.getElementById("pantalla").classList.remove("activa");
  SECCION_ACTUAL=null; LISTA_ACTUAL=null; TAREA_ACTUAL=null;

}

/* ---------- pintar tareas ---------- */
function pillsDe(t){
  let p="";
  if(esVencida(t))p+='<span class="pill p-venc">Vencida</span>';
  else if(esHoy(t)&&activa(t))p+='<span class="pill p-hoy">Hoy</span>';
  else if(esProxima(t))p+='<span class="pill p-prox">'+esc(t.vencimiento)+'</span>';
  if(esUrgente(t)&&activa(t))p+='<span class="pill p-urg">Urgente</span>';
  if(!activa(t))p+='<span class="pill p-ok">Completada</span>';
  if(esSeis(t)&&activa(t)&&t.ordenSeis)p+='<span class="pill p-seis">'+esc(t.ordenSeis)+' de '+LIMITE_SEIS+'</span>';
  if(esGeneral()&&t.dimension)p+='<span class="pill p-dim">'+esc(t.dimension)+'</span>';
  return p;
}
function tareaHTML(t,conAsa){
  const per=String(t.persona||"").trim();
  let meta=pillsDe(t);
  if(per&&per!=="-")meta+='<span>'+ico("user")+esc(per)+'</span>';
  if(t.metodologia)meta+='<span>'+ico("bulb")+esc(enfNom(t.metodologia))+'</span>';
  if(t.energia)meta+='<span>'+ico("bolt")+esc(t.energia)+'</span>';
  if(Number(t.pomodoros))meta+='<span>'+ico("clock-play")+t.pomodoros+'</span>';

  let acc='<button class="icon-btn ib-edit" onclick="event.stopPropagation();abrirDetalle('+t.fila+')" aria-label="Detalle">'+ico("pencil")+'</button>';
  if(activa(t))acc='<button class="icon-btn ib-ok" onclick="event.stopPropagation();completar('+t.fila+')" aria-label="Completar">'+ico("check")+'</button>'+acc;
  acc+='<button class="icon-btn ib-del" onclick="event.stopPropagation();borrarTarea('+t.fila+')" aria-label="Eliminar">'+ico("trash")+'</button>';

  return '<div class="tarea'+(activa(t)?"":" hecha")+'" data-fila="'+t.fila+'">'+
    (conAsa?'<div class="asa" data-asa="1">'+ico("grip-vertical")+'</div>':"")+
    '<div class="cuerpo" onclick="abrirDetalle('+t.fila+')">'+
      '<div class="desc">'+esc(t.descripcion)+'</div>'+
      (t.detalle?'<div class="det">'+esc(t.detalle)+'</div>':"")+
      '<div class="meta">'+meta+'</div>'+
    '</div><div class="acciones">'+acc+'</div></div>';
}

function pintarFiltro(cont,sec){
  const esSeisSec = sec.enfoque===ENF_SEIS;
  const lista = esSeisSec ? ordenarSeis(sec.f()) : ordenar(sec.f());
  let h="";

  if(esSeisSec){
    const u=seisActivas().length;
    h+='<div class="ayuda">Estas son las seis cosas que de verdad importan. El limite es de '+LIMITE_SEIS+' en todo el sistema, sin importar la dimension. Vas '+u+' de '+LIMITE_SEIS+'. Arrastra para cambiar el orden.</div>';
  } else {
    h+='<div class="barra-orden">'+
       '<span class="tag-orden">'+(modoOrden()==="manual"?"Orden manual":"Orden por vencimiento")+'</span>'+
       (modoOrden()==="manual"?'<button class="link-orden" onclick="volverAuto()">Volver al automatico</button>':'<span class="tag-orden" style="background:transparent;color:#9AB0C6">Arrastra para ordenar a mano</span>')+
       '</div>';
  }

  if(sec.id==="f-comp"&&lista.length){
    h+='<button class="btn btn-borde" style="width:100%;margin-bottom:14px" onclick="borrarCompletadas()">'+ico("trash")+' Eliminar las '+lista.length+' completadas'+(esGeneral()?"":" de "+DIM)+'</button>';
  }

  h+='<div id="cont-tareas">';
  if(!lista.length)h+='<div class="vacio">No hay tareas aqui por ahora</div>';
  else lista.forEach(function(t){ h+=tareaHTML(t,true); });
  h+='</div>';
  cont.innerHTML=h;
  activarArrastre(esSeisSec?"seis":"manual");
}

function pintarPorPersona(cont,sec){
  const lista=sec.f();
  const grupos={};
  lista.forEach(function(t){
    String(t.persona||"").split(",").forEach(function(nm){
      const n=nm.trim(); if(!n||n==="-")return;
      if(!grupos[n])grupos[n]=[];
      grupos[n].push(t);
    });
  });
  const nombres=Object.keys(grupos).sort(function(a,b){ return norm(a).localeCompare(norm(b)); });
  let h='<div class="ayuda">'+(sec.porPersona==="activas"?"Todo lo que sigue abierto, agrupado por quien esta involucrado.":"Lo que ya quedo listo, agrupado por quien participo.")+'</div>';
  if(!nombres.length)h+='<div class="vacio">Todavia no hay tareas con personas asignadas</div>';
  nombres.forEach(function(n){

/* ---------- arrastre ---------- */
function activarArrastre(modo){
  const cont=document.getElementById("cont-tareas"); if(!cont)return;
  let arr=null, ph=null;
  const filas=cont.querySelectorAll(".tarea");
  filas.forEach(function(el){
    const asa=el.querySelector('[data-asa]'); if(!asa)return;
    asa.addEventListener("pointerdown",function(ev){
      ev.preventDefault();
      arr=el; el.classList.add("arrastrando");
      asa.setPointerCapture(ev.pointerId);
      const mover=function(e){
        const y=e.clientY;
        const hermanos=Array.prototype.slice.call(cont.querySelectorAll(".tarea")).filter(function(x){ return x!==arr; });
        let ref=null;
        for(let i=0;i<hermanos.length;i++){
          const r=hermanos[i].getBoundingClientRect();
          if(y < r.top + r.height/2){ ref=hermanos[i]; break; }
        }
        if(ref)cont.insertBefore(arr,ref); else cont.appendChild(arr);
      };
      const soltar=async function(){
        asa.removeEventListener("pointermove",mover);
        asa.removeEventListener("pointerup",soltar);
        asa.removeEventListener("pointercancel",soltar);
        el.classList.remove("arrastrando"); arr=null;
        const filas=Array.prototype.slice.call(cont.querySelectorAll(".tarea")).map(function(x){ return Number(x.getAttribute("data-fila")); });
        if(modo==="seis"){ await api("guardarOrdenSeis",{orden:filas}); }
        else{ await api("guardarOrdenManual",{orden:filas,dimension:DIM}); PREFS["orden:"+DIM]="manual"; }
        await cargarTodo();
        if(SECCION_ACTUAL)abrir(SECCION_ACTUAL);
      };
      asa.addEventListener("pointermove",mover);
      asa.addEventListener("pointerup",soltar);
      asa.addEventListener("pointercancel",soltar);
    });
  });
}
async function volverAuto(){
  await api("restaurarOrdenAuto",{dimension:DIM});
  PREFS["orden:"+DIM]="auto";
  await cargarTodo();
  if(SECCION_ACTUAL)abrir(SECCION_ACTUAL);
}

function reordenarConPosicion(fila,pos){
  const lista=ordenarSeis(seisActivas().filter(function(t){ return Number(t.fila)!==Number(fila); }));

}

  const ls=LISTAS.filter(function(x){ return x.tipo==="lista"&&enDim(x); });
  let h='<div class="card"><h3>'+ico("checks")+'Nueva lista</h3><div class="form-grid">'+

    '<div><label>Dimension</label>'+selectDim(DIM,"l-dim")+'</div>'+
    '</div><button class="btn btn-primario" style="width:100%" onclick="guardarLista()">Crear lista</button></div>';
  if(!ls.length)h+='<div class="vacio">No hay listas en '+esc(DIM)+'</div>';
  ls.forEach(function(l){
    const items=LISTAS.filter(function(x){ return x.tipo==="item"&&x.lista===l.lista; });
    const hechos=items.filter(function(x){ return x.completado; }).length;
    h+='<div class="lista-card" onclick="abrirLista(\''+esc(l.lista).replace(/'/g,"\\'")+'\')">'+

       '<div class="ch">'+ico("chevron-right")+'</div></div>';
  });
  cont.innerHTML=h;
}
async function guardarLista(){
  const n=document.getElementById("l-nom").value.trim();
  if(!n){ alert("Escribe el nombre de la lista"); return; }
  const r=await api("crearLista",{nombre:n,dimension:document.getElementById("l-dim").value});
  if(!r||!r.ok){ alert((r&&r.error)||"No se pudo crear"); return; }
  await cargarTodo(); construir(); abrir("listas");
}
function abrirLista(nombre){
  LISTA_ACTUAL=nombre; SECCION_ACTUAL="lista-detalle";
  document.getElementById("pt-titulo").textContent=nombre;
  document.getElementById("pt-sub").textContent=DIM;
  const b=document.getElementById("pt-body");
  const items=LISTAS.filter(function(x){ return x.tipo==="item"&&x.lista===nombre; }).sort(function(a,b){ return a.orden-b.orden; });
  let h='<div class="add-row"><input type="text" id="i-txt" placeholder="Agregar elemento" onkeydown="if(event.key===\'Enter\')agregarItem()">'+
        '<button class="btn btn-primario" onclick="agregarItem()">'+ico("plus")+'</button></div>';
  if(!items.length)h+='<div class="vacio">Lista vacia</div>';
  items.forEach(function(i){
    h+='<div class="item'+(i.completado?" hecho":"")+'">'+
       '<div class="check'+(i.completado?" on":"")+'" onclick="toggleItem(\''+esc(i.id)+'\')">'+(i.completado?ico("check"):"")+'</div>'+
       '<div class="tx">'+esc(i.texto)+'</div>'+
       '<button class="icon-btn ib-del" onclick="borrarItem(\''+esc(i.id)+'\')">'+ico("trash")+'</button></div>';
  });
  h+='<button class="btn btn-borde" style="width:100%;margin-top:14px" onclick="borrarLista()">'+ico("trash")+' Eliminar la lista completa</button>';
  b.innerHTML=h;
  document.getElementById("pantalla").classList.add("activa");
  marcarTab("");
}
async function agregarItem(){
  const t=document.getElementById("i-txt").value.trim();
  if(!t)return;
  await api("crearItemLista",{lista:LISTA_ACTUAL,texto:t});

}

async function borrarItem(id){ await api("eliminarItemLista",{id:id}); await cargarTodo(); abrirLista(LISTA_ACTUAL); }

async function guardarNombrePerfil(){
  const v=document.getElementById("pf-nom").value.trim();
  await api("guardarPref",{clave:"perfil:nombre",valor:v});
  PREFS["perfil:nombre"]=v; abrir("perfil");
}
function subirFoto(input){
  const f=input.files&&input.files[0]; if(!f)return;
  const lector=new FileReader();
  lector.onload=function(ev){
    const img=new Image();
    img.onload=async function(){
      const lado=Math.min(img.width,img.height);
      const cv=document.createElement("canvas"); cv.width=400; cv.height=400;
      const cx=cv.getContext("2d");
      cx.drawImage(img,(img.width-lado)/2,(img.height-lado)/2,lado,lado,0,0,400,400);
      const datos=cv.toDataURL("image/jpeg",0.82).split(",")[1];
      const r=await api("guardarFotoPerfil",{datos:datos,tipo:"image/jpeg"});
      input.value="";
      if(r&&r.ok){ PREFS["perfil:fotoUrl"]=r.url; PREFS["perfil:fotoId"]=r.id; pintarFotoMini(); abrir("perfil"); }
      else alert((r&&r.error)||"No se pudo subir la foto");
    };
    img.src=ev.target.result;
  };
  lector.readAsDataURL(f);
}
async function quitarFoto(){
  if(!confirm("Quitar tu foto de perfil?"))return;
  await api("eliminarFotoPerfil",{});
  PREFS["perfil:fotoUrl"]=""; PREFS["perfil:fotoId"]="";
  pintarFotoMini(); abrir("perfil");
}

/* ---------- pomodoro ---------- */
let pFila=null,pTotal=25*60,pResta=25*60,pCorre=false,pInt=null,pIni=0;
function pintarPomodoro(cont){
  const abiertas=ordenar(tareasDim().filter(activa));
  let ops='<option value="">Sesion libre, sin tarea</option>';
  abiertas.forEach(function(t){ ops+='<option value="'+t.fila+'">'+esc(String(t.descripcion).substring(0,52))+'</option>'; });
  cont.innerHTML=
    '<div class="card"><h3>'+ico("clock-play")+'Sesion de enfoque</h3>'+
    '<div class="form-grid"><div><label>Tarea</label><select id="p-tarea">'+ops+'</select></div>'+
    '<div><label>Duracion</label><div class="dur-row">'+
      [15,25,45].map(function(m){ return '<button class="btn btn-suave" style="flex:1" onclick="pDur('+m+')">'+m+' min</button>'; }).join("")+
    '</div></div></div>'+
    '<div class="pomo"><div class="pomo-time" id="p-time">25:00</div>'+
    '<div id="p-ctrl"><button class="btn btn-primario" style="width:100%" onclick="pIniciar()">Comenzar</button></div></div>'+
    '<div id="p-fin" class="oculto" style="margin-top:14px"><label>Como quedo la tarea</label><div class="est-grid">'+
      '<button class="est-btn" style="background:var(--ok)" onclick="pEstado(\'Completada\')">Completada</button>'+
      '<button class="est-btn" style="background:var(--azul)" onclick="pEstado(\'En Progreso\')">En progreso</button>'+
      '<button class="est-btn" style="background:var(--sol-os)" onclick="pEstado(\'En Pausa\')">En pausa</button>'+
      '<button class="est-btn" style="background:#7C8DA0" onclick="pEstado(\'Pendiente\')">Pendiente</button>'+
    '</div></div></div>';
  pResta=pTotal; pPintar();
}
function pDur(m){ if(pCorre)return; pTotal=m*60; pResta=pTotal; pPintar(); }
function pPintar(){
  const e=document.getElementById("p-time"); if(!e)return;
  e.textContent=String(Math.floor(pResta/60)).padStart(2,"0")+":"+String(pResta%60).padStart(2,"0");
}
function pIniciar(){
  const s=document.getElementById("p-tarea");
  pFila=s&&s.value?Number(s.value):null;
  pCorre=true; pIni=Date.now(); pResta=pTotal; pPintar();
  document.getElementById("p-ctrl").innerHTML='<button class="btn btn-borde" style="width:100%" onclick="pDetener()">Detener</button>';
  clearInterval(pInt); pInt=setInterval(pTick,500);
}
function pTick(){
  if(!pCorre)return;
  pResta=pTotal-Math.floor((Date.now()-pIni)/1000);
  if(pResta<=0){ pResta=0; pPintar(); pTerminar(); } else pPintar();
}
async function pTerminar(){
  clearInterval(pInt); pCorre=false; beep(6);
  if(pFila)await api("sumarPomodoro",{fila:pFila,cantidad:1,duracion:Math.round(pTotal/60)});
  const c=document.getElementById("p-ctrl"); if(c)c.innerHTML='<div style="font-weight:700;color:var(--ok)">Sesion completada</div>';
  const f=document.getElementById("p-fin"); if(f)f.classList.remove("oculto");
  await cargarTodo();
}
function pDetener(){
  clearInterval(pInt); pCorre=false;
  const c=document.getElementById("p-ctrl"); if(c)c.innerHTML='<div style="font-weight:700;color:var(--coral)">Sesion detenida</div>';
  const f=document.getElementById("p-fin"); if(f)f.classList.remove("oculto");
}
async function pEstado(e){
  if(pFila){
    const r=await api("cambiarEstado",{fila:pFila,estado:e});
    if(r&&!r.ok){ alert(r.error||"No se pudo cambiar el estado"); return; }
    if(igual(e,"Completada"))celebrar();
  }
  await cargarTodo(); construir(); pFila=null; abrir("enfoque");
}

/* ---------- panel de temas + selector de color ---------- */
let cpHSV={h:214,s:0.86,v:0.76}, cpDestino="header", cpPrevio=null;
function hsv2hex(h,s,v){
  const c=v*s, x=c*(1-Math.abs(((h/60)%2)-1)), m=v-c;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  return "#"+[r,g,b].map(function(v2){ return Math.round((v2+m)*255).toString(16).padStart(2,"0"); }).join("").toUpperCase();
}
function hex2hsv(hex){
  const c=rgbDe(hex).map(function(x){ return x/255; });
  const mx=Math.max.apply(null,c), mn=Math.min.apply(null,c), df=mx-mn;
  let h=0;
  if(df){
    if(mx===c[0])h=60*(((c[1]-c[2])/df)%6);
    else if(mx===c[1])h=60*(((c[2]-c[0])/df)+2);
    else h=60*(((c[0]-c[1])/df)+4);
  }
  if(h<0)h+=360;
  return {h:h,s:mx?df/mx:0,v:mx};
}
function abrirPanel(){
  const t=leerTema(), f=leerFondo(), c=leerCustom();
  cpPrevio={tema:t,custom:JSON.parse(JSON.stringify(c))};
  let h='<div class="sub">Tema</div><div class="tema-grid">'+
    '<div class="tema-op'+(t==="sotelo7"?" sel":"")+'" style="background:linear-gradient(135deg,#1B5FC2,#3B82E8)" onclick="elegirTema(\'sotelo7\')">Sotelo7</div>'+
    '<div class="tema-op'+(t==="personalizado"?" sel":"")+'" style="background:linear-gradient(135deg,'+c.header+','+tono(c.header,0.25)+')" onclick="elegirTema(\'personalizado\')">Personalizado</div>'+
    '</div>';
  if(t==="personalizado"){
    h+='<div class="sub">Vista previa</div>'+
      '<div class="previa" id="cp-previa">'+
        '<div class="previa-hdr" id="cp-prev-hdr"><span class="pm" id="cp-prev-mark"></span><span>Sotelo7</span></div>'+
        '<div class="previa-cpo" id="cp-prev-cpo"><div class="previa-fila">Una tarea de ejemplo</div></div>'+
      '</div>'+
      '<div class="sub">Elige el color</div>'+
      '<div class="cp-tabs">'+
        '<button class="cp-tab on" id="cp-t-header" onclick="cpDestinoSet(\'header\')">Encabezado</button>'+
        '<button class="cp-tab" id="cp-t-fondo" onclick="cpDestinoSet(\'fondo\')">Fondo</button>'+
      '</div>'+
      '<div class="cp">'+
        '<div class="cp-sv" id="cp-sv"><div class="capa blanco"></div><div class="capa negro"></div><div class="cp-punto" id="cp-punto"></div></div>'+
        '<div class="cp-hue" id="cp-hue"><div class="cp-hue-punto" id="cp-hue-punto"></div></div>'+
        '<div class="cp-abajo"><div class="cp-muestra" id="cp-muestra"></div>'+
          '<input type="text" id="cp-hex" maxlength="7" onchange="cpDesdeHex(this.value)"></div>'+
      '</div>'+
      '<button class="btn btn-primario" style="width:100%;margin-top:6px" onclick="guardarCustom()">Aplicar colores</button>'+
      '<button class="btn btn-borde" style="width:100%;margin-top:8px" onclick="cancelarCustom()">Cancelar</button>';
  } else {
    h+='<div class="sub">Fondo</div><div class="fondo-grid">';
    Object.keys(FONDOS).forEach(function(k){
      h+='<div class="fondo-op'+(k===f?" sel":"")+'" style="background:'+FONDOS[k].c+'" onclick="elegirFondo(\''+k+'\')">'+FONDOS[k].n+'</div>';
    });
    h+='</div>';
  }
  document.getElementById("panel-body").innerHTML=h;
  document.getElementById("panel").classList.remove("oculto");
  if(t==="personalizado"){ cpDestino="header"; cpHSV=hex2hsv(c.header); montarPicker(); cpRefrescar(true); }
}
function cerrarPanel(){ document.getElementById("panel").classList.add("oculto"); }
function elegirTema(t){ gset("s7_tema",t); aplicarTema(); abrirPanel(); construir(); }
function elegirFondo(k){ gset("s7_fondo",k); aplicarTema(); abrirPanel(); }
function cpDestinoSet(d){
  cpDestino=d;
  document.getElementById("cp-t-header").classList.toggle("on",d==="header");
  document.getElementById("cp-t-fondo").classList.toggle("on",d==="fondo");
  const c=leerCustom();
  cpHSV=hex2hsv(d==="header"?c.header:c.fondo);
  cpRefrescar(true);
}
function montarPicker(){
  const sv=document.getElementById("cp-sv"), hu=document.getElementById("cp-hue");
  if(!sv)return;
  function svPos(e){
    const r=sv.getBoundingClientRect();
    cpHSV.s=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    cpHSV.v=Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height));
    cpRefrescar(false);
  }
  function huPos(e){
    const r=hu.getBoundingClientRect();
    cpHSV.h=Math.max(0,Math.min(359.9,((e.clientX-r.left)/r.width)*360));
    cpRefrescar(false);
  }
  function arrastrar(el,fn){
    el.addEventListener("pointerdown",function(e){
      e.preventDefault(); el.setPointerCapture(e.pointerId); fn(e);
      const mv=function(ev){ fn(ev); };
      const up=function(){ el.removeEventListener("pointermove",mv); el.removeEventListener("pointerup",up); el.removeEventListener("pointercancel",up); };
      el.addEventListener("pointermove",mv); el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
    });
  }
  arrastrar(sv,svPos); arrastrar(hu,huPos);
}
function cpRefrescar(mueveHex){
  const hex=hsv2hex(cpHSV.h,cpHSV.s,cpHSV.v);
  const sv=document.getElementById("cp-sv");
  if(sv)sv.style.background=hsv2hex(cpHSV.h,1,1);
  const pt=document.getElementById("cp-punto");
  if(pt){ pt.style.left=(cpHSV.s*100)+"%"; pt.style.top=((1-cpHSV.v)*100)+"%"; pt.style.background=hex; }
  const hp=document.getElementById("cp-hue-punto");
  if(hp){ hp.style.left=((cpHSV.h/360)*100)+"%"; hp.style.background=hsv2hex(cpHSV.h,1,1); }
  const ms=document.getElementById("cp-muestra"); if(ms)ms.style.background=hex;
  const hx=document.getElementById("cp-hex"); if(hx&&(mueveHex||document.activeElement!==hx))hx.value=hex;

  const c=leerCustom();
  const header = cpDestino==="header"?hex:c.header;
  const fondo  = cpDestino==="fondo"?hex:c.fondo;
  const ph=document.getElementById("cp-prev-hdr"), pc=document.getElementById("cp-prev-cpo"), pm=document.getElementById("cp-prev-mark");
  if(ph){ ph.style.background=header; ph.style.color=luz(header)>0.65?"#16324F":"#FFFFFF"; }
  if(pc)pc.style.background=fondo;
  if(pm)pm.innerHTML=marca("suave");
  aplicarColores(header,fondo);   // vista previa en vivo sobre toda la app
}
function cpDesdeHex(v){
  if(!hexValido(v)){ alert("Usa un color en formato hexadecimal, por ejemplo #1B5FC2"); return; }
  cpHSV=hex2hsv(normHex(v)); cpRefrescar(true);
}
function guardarCustom(){
  const hex=hsv2hex(cpHSV.h,cpHSV.s,cpHSV.v);
  const c=leerCustom();
  if(cpDestino==="header")c.header=hex; else c.fondo=hex;
  gset("s7_custom",JSON.stringify(c));
  gset("s7_tema","personalizado");
  aplicarTema(); construir(); abrirPanel();
}
function cancelarCustom(){
  if(cpPrevio){ gset("s7_tema",cpPrevio.tema); gset("s7_custom",JSON.stringify(cpPrevio.custom)); }
  aplicarTema(); construir(); cerrarPanel();
}

/* ---------- ruleta de energia ---------- */
function abrirRuleta(){
  const o=document.getElementById("ruleta"), m=document.getElementById("ru-mark"),
        t=document.getElementById("ru-txt"), b=document.getElementById("ru-btns");
  o.classList.remove("oculto"); b.classList.add("oculto"); t.textContent="Un momento...";
  m.innerHTML=marca(modoMarcaClara());
  m.classList.add("late");
  setTimeout(function(){ m.classList.remove("late"); t.textContent="Como esta tu energia hoy?"; b.classList.remove("oculto"); },1200);
}
function cerrarRuleta(){ document.getElementById("ruleta").classList.add("oculto"); }
function ruletaVa(n){ cerrarRuleta(); abrir({Alta:"e-alta",Media:"e-media",Baja:"e-baja"}[n]); }

});
